name: Build L.E.B-M BR 3D APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create L.E.B-M BR 3D Android project
        run: |
          rm -rf br3d_app
          mkdir -p br3d_app/app/src/main/java/com/leb/br3d \
                   br3d_app/app/src/main/res/values \
                   br3d_app/app/src/main/res/mipmap-mdpi \
                   br3d_app/app/src/main/res/mipmap-hdpi \
                   br3d_app/app/src/main/res/mipmap-xhdpi \
                   br3d_app/app/src/main/res/mipmap-xxhdpi \
                   br3d_app/app/src/main/res/mipmap-xxxhdpi

          cat << 'EOF' > br3d_app/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LEBMBR3D"
          include(":app")
          EOF

          cat << 'EOF' > br3d_app/build.gradle
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat << 'EOF' > br3d_app/gradle.properties
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

          cat << 'EOF' > br3d_app/app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.leb.br3d'
              compileSdk 34

              defaultConfig {
                  applicationId "com.leb.br3d"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.13.1'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
          }
          EOF

          cat << 'EOF' > br3d_app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:glEsVersion="0x00020000" android:required="true" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.Material3.Dark.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="landscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > br3d_app/app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">L.E.B-M Survival 3D</string>
          </resources>
          EOF

          cat << 'EOF' > br3d_app/app/src/main/java/com/leb/br3d/MainActivity.kt
          package com.leb.br3d

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.PixelFormat
          import android.opengl.GLES20
          import android.opengl.GLSurfaceView
          import android.opengl.Matrix
          import android.os.Bundle
          import android.view.MotionEvent
          import android.view.View
          import android.widget.FrameLayout
          import androidx.appcompat.app.AppCompatActivity
          import java.nio.ByteBuffer
          import java.nio.ByteOrder
          import java.nio.FloatBuffer
          import javax.microedition.khronos.egl.EGLConfig
          import javax.microedition.khronos.opengles.GL10
          import kotlin.math.atan2
          import kotlin.math.cos
          import kotlin.math.hypot
          import kotlin.math.sin
          import kotlin.random.Random

          enum class WeaponType(val label: String, val damage: Int, val cooldownFrames: Int, val pellets: Int, val spread: Float) {
              PISTOL("PISTOLA", 25, 14, 1, 0.02f),
              RIFLE("RIFLE AR", 22, 6, 1, 0.04f),
              SHOTGUN("ESCOPETA", 18, 28, 5, 0.18f)
          }

          data class BoxObstacle(val x: Float, val z: Float, val halfW: Float, val halfD: Float, val height: Float, val color: FloatArray)
          data class Enemy3D(var x: Float, var z: Float, var hp: Int, var yaw: Float, var shootTimer: Int)
          data class Loot3D(val x: Float, val z: Float, val type: Int) // 0=Medkit, 1=Rifle, 2=Shotgun, 3=Ammo
          data class Projectile3D(var x: Float, var y: Float, var z: Float, val vx: Float, val vz: Float, val damage: Int, val fromPlayer: Boolean, var life: Int)

          class GameWorld {
              var playerX = 0f
              var playerZ = 0f
              var playerYaw = 0f // radianes
              var playerPitch = -0.15f
              var hp = 100
              var shield = 50
              var kills = 0
              var ammo = 60
              var weapon = WeaponType.PISTOL
              var fireCooldown = 0
              var isSprinting = false
              var thirdPerson = true

              var zoneRadius = 55f
              var zoneTick = 0
              var matchOver = false
              var victory = false

              val obstacles = mutableListOf<BoxObstacle>()
              val enemies = mutableListOf<Enemy3D>()
              val loots = mutableListOf<Loot3D>()
              val projectiles = mutableListOf<Projectile3D>()

              init {
                  reset()
              }

              @Synchronized
              fun reset() {
                  playerX = 0f
                  playerZ = 18f
                  playerYaw = 0f
                  playerPitch = -0.12f
                  hp = 100
                  shield = 50
                  kills = 0
                  ammo = 60
                  weapon = WeaponType.PISTOL
                  fireCooldown = 0
                  zoneRadius = 58f
                  zoneTick = 0
                  matchOver = false
                  victory = false

                  obstacles.clear()
                  enemies.clear()
                  loots.clear()
                  projectiles.clear()

                  // Edificios y coberturas 3D
                  val buildingColor = floatArrayOf(0.32f, 0.36f, 0.42f, 1f)
                  val crateColor = floatArrayOf(0.55f, 0.38f, 0.20f, 1f)
                  val wallColor = floatArrayOf(0.25f, 0.30f, 0.28f, 1f)

                  obstacles.add(BoxObstacle(-12f, -8f, 3.5f, 3.5f, 5.5f, buildingColor))
                  obstacles.add(BoxObstacle(14f, -12f, 4.0f, 3.0f, 6.0f, buildingColor))
                  obstacles.add(BoxObstacle(0f, -24f, 5.0f, 3.5f, 6.5f, buildingColor))
                  obstacles.add(BoxObstacle(-18f, 12f, 3.0f, 4.0f, 5.0f, buildingColor))
                  obstacles.add(BoxObstacle(18f, 10f, 3.5f, 3.5f, 5.0f, buildingColor))

                  // Cajas de cobertura
                  val crateCoords = listOf(
                      -5f to 4f, 6f to 5f, -4f to -14f, 7f to -2f, -15f to 0f, 12f to 18f, 0f to 8f
                  )
                  for ((cx, cz) in crateCoords) {
                      obstacles.add(BoxObstacle(cx, cz, 1.3f, 1.3f, 2.0f, crateColor))
                  }

                  // Muros perimetrales
                  obstacles.add(BoxObstacle(0f, -45f, 45f, 1f, 4f, wallColor))
                  obstacles.add(BoxObstacle(0f, 45f, 45f, 1f, 4f, wallColor))
                  obstacles.add(BoxObstacle(-45f, 0f, 1f, 45f, 4f, wallColor))
                  obstacles.add(BoxObstacle(45f, 0f, 1f, 45f, 4f, wallColor))

                  // Enemigos IA
                  val spawnPts = listOf(
                      -22f to -20f, 22f to -22f, 0f to -34f, -28f to 5f, 27f to 4f, -10f to -30f, 15f to -28f, 24f to 22f
                  )
                  for ((ex, ez) in spawnPts) {
                      enemies.add(Enemy3D(ex, ez, 80, Random.nextFloat() * 6.28f, Random.nextInt(30, 80)))
                  }

                  // Botín 3D
                  loots.add(Loot3D(3f, 10f, 1))   // Rifle AR
                  loots.add(Loot3D(-4f, 10f, 2))  // Escopeta
                  loots.add(Loot3D(0f, 3f, 0))    // Botiquín
                  loots.add(Loot3D(-10f, -2f, 3)) // Munición
                  loots.add(Loot3D(10f, -5f, 0))  // Botiquín
                  loots.add(Loot3D(2f, -17f, 3))  // Munición
                  loots.add(Loot3D(-14f, 16f, 0)) // Botiquín
              }

              @Synchronized
              fun step(moveForward: Float, moveRight: Float) {
                  if (matchOver) return

                  if (fireCooldown > 0) fireCooldown--
                  if (zoneRadius > 14f) zoneRadius -= 0.015f

                  // Movimiento relativo a la cámara
                  val speed = if (isSprinting) 0.34f else 0.22f
                  val sinY = sin(playerYaw)
                  val cosY = cos(playerYaw)
                  val dx = (-sinY * moveForward + cosY * moveRight) * speed
                  val dz = (-cosY * moveForward - sinY * moveRight) * speed

                  val nextX = (playerX + dx).coerceIn(-42f, 42f)
                  val nextZ = (playerZ + dz).coerceIn(-42f, 42f)
                  if (!collidesWithObstacle(nextX, playerZ, 0.7f)) playerX = nextX
                  if (!collidesWithObstacle(playerX, nextZ, 0.7f)) playerZ = nextZ

                  // Daño de zona
                  if (hypot(playerX.toDouble(), playerZ.toDouble()) > zoneRadius) {
                      zoneTick++
                      if (zoneTick >= 35) {
                          zoneTick = 0
                          applyDamageToPlayer(4)
                      }
                  }

                  // Recoger loot
                  val lIt = loots.iterator()
                  while (lIt.hasNext()) {
                      val item = lIt.next()
                      if (hypot((item.x - playerX).toDouble(), (item.z - playerZ).toDouble()) < 1.6f) {
                          when (item.type) {
                              0 -> hp = (hp + 35).coerceAtMost(100)
                              1 -> { weapon = WeaponType.RIFLE; ammo += 45 }
                              2 -> { weapon = WeaponType.SHOTGUN; ammo += 24 }
                              3 -> ammo += 40
                          }
                          lIt.remove()
                      }
                  }

                  // IA de enemigos
                  for (e in enemies) {
                      val ex = playerX - e.x
                      val ez = playerZ - e.z
                      val dist = hypot(ex.toDouble(), ez.toDouble()).toFloat().coerceAtLeast(0.1f)
                      e.yaw = atan2(-ex.toDouble(), -ez.toDouble()).toFloat()

                      if (dist > 6.5f && dist < 38f) {
                          val stepX = e.x + (ex / dist) * 0.09f
                          val stepZ = e.z + (ez / dist) * 0.09f
                          if (!collidesWithObstacle(stepX, e.z, 0.7f)) e.x = stepX
                          if (!collidesWithObstacle(e.x, stepZ, 0.7f)) e.z = stepZ
                      }

                      e.shootTimer--
                      if (e.shootTimer <= 0 && dist < 30f) {
                          e.shootTimer = Random.nextInt(55, 100)
                          val spread = (Random.nextFloat() - 0.5f) * 0.14f
                          val ang = e.yaw + spread
                          projectiles.add(
                              Projectile3D(
                                  e.x - sin(ang) * 0.9f,
                                  1.2f,
                                  e.z - cos(ang) * 0.9f,
                                  -sin(ang) * 0.85f,
                                  -cos(ang) * 0.85f,
                                  10,
                                  fromPlayer = false,
                                  life = 55
                              )
                          )
                      }
                  }

                  // Proyectiles
                  val pIt = projectiles.iterator()
                  while (pIt.hasNext()) {
                      val p = pIt.next()
                      p.x += p.vx
                      p.z += p.vz
                      p.life--

                      if (p.life <= 0 || collidesWithObstacle(p.x, p.z, 0.2f)) {
                          pIt.remove()
                          continue
                      }

                      if (p.fromPlayer) {
                          var hit = false
                          val eIt = enemies.iterator()
                          while (eIt.hasNext()) {
                              val e = eIt.next()
                              if (hypot((p.x - e.x).toDouble(), (p.z - e.z).toDouble()) < 0.95f) {
                                  e.hp -= p.damage
                                  hit = true
                                  if (e.hp <= 0) {
                                      eIt.remove()
                                      kills++
                                  }
                                  break
                              }
                          }
                          if (hit) pIt.remove()
                      } else {
                          if (hypot((p.x - playerX).toDouble(), (p.z - playerZ).toDouble()) < 0.85f) {
                              applyDamageToPlayer(p.damage)
                              pIt.remove()
                          }
                      }
                  }

                  if (hp <= 0) {
                      hp = 0
                      matchOver = true
                      victory = false
                  } else if (enemies.isEmpty()) {
                      matchOver = true
                      victory = true
                  }
              }

              private fun applyDamageToPlayer(dmg: Int) {
                  if (shield > 0) {
                      val absorbed = minOf(shield, dmg)
                      shield -= absorbed
                      hp -= (dmg - absorbed)
                  } else {
                      hp -= dmg
                  }
              }

              @Synchronized
              fun firePlayerWeapon() {
                  if (matchOver || fireCooldown > 0 || ammo <= 0) return
                  fireCooldown = weapon.cooldownFrames
                  ammo = (ammo - 1).coerceAtLeast(0)

                  repeat(weapon.pellets) {
                      val spread = (Random.nextFloat() - 0.5f) * weapon.spread
                      val ang = playerYaw + spread
                      projectiles.add(
                          Projectile3D(
                              playerX - sin(ang) * 0.9f,
                              1.25f,
                              playerZ - cos(ang) * 0.9f,
                              -sin(ang) * 1.35f,
                              -cos(ang) * 1.35f,
                              weapon.damage,
                              fromPlayer = true,
                              life = 55
                          )
                      )
                  }
              }

              @Synchronized
              fun cycleWeapon() {
                  weapon = when (weapon) {
                      WeaponType.PISTOL -> WeaponType.RIFLE
                      WeaponType.RIFLE -> WeaponType.SHOTGUN
                      WeaponType.SHOTGUN -> WeaponType.PISTOL
                  }
              }

              private fun collidesWithObstacle(x: Float, z: Float, radius: Float): Boolean {
                  for (o in obstacles) {
                      if (x + radius > o.x - o.halfW && x - radius < o.x + o.halfW &&
                          z + radius > o.z - o.halfD && z - radius < o.z + o.halfD) {
                          return true
                      }
                  }
                  return false
              }
          }

          class MainActivity : AppCompatActivity() {
              private lateinit var glView: GLSurfaceView
              private val world = GameWorld()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val root = FrameLayout(this)

                  glView = GLSurfaceView(this).apply {
                      setEGLContextClientVersion(2)
                      setRenderer(World3DRenderer(world))
                      renderMode = GLSurfaceView.RENDERMODE_CONTINUOUSLY
                  }

                  val hudOverlay = HudOverlayView(this, world)
                  root.addView(glView)
                  root.addView(hudOverlay)
                  setContentView(root)
              }

              override fun onPause() {
                  super.onPause()
                  glView.onPause()
              }

              override fun onResume() {
                  super.onResume()
                  glView.onResume()
              }
          }

          class World3DRenderer(private val world: GameWorld) : GLSurfaceView.Renderer {
              private var program = 0
              private var posHandle = 0
              private var mvpHandle = 0
              private var colorHandle = 0

              private val projMatrix = FloatArray(16)
              private val viewMatrix = FloatArray(16)
              private val vpMatrix = FloatArray(16)
              private val modelMatrix = FloatArray(16)
              private val mvpMatrix = FloatArray(16)

              private lateinit var cubeBuffer: FloatBuffer

              private val cubeCoords = floatArrayOf(
                  // Frente
                  -0.5f, 0f, 0.5f,  0.5f, 0f, 0.5f,  0.5f, 1f, 0.5f,
                  -0.5f, 0f, 0.5f,  0.5f, 1f, 0.5f, -0.5f, 1f, 0.5f,
                  // Atrás
                  0.5f, 0f, -0.5f, -0.5f, 0f, -0.5f, -0.5f, 1f, -0.5f,
                  0.5f, 0f, -0.5f, -0.5f, 1f, -0.5f,  0.5f, 1f, -0.5f,
                  // Izquierda
                  -0.5f, 0f, -0.5f, -0.5f, 0f, 0.5f, -0.5f, 1f, 0.5f,
                  -0.5f, 0f, -0.5f, -0.5f, 1f, 0.5f, -0.5f, 1f, -0.5f,
                  // Derecha
                  0.5f, 0f, 0.5f,  0.5f, 0f, -0.5f,  0.5f, 1f, -0.5f,
                  0.5f, 0f, 0.5f,  0.5f, 1f, -0.5f,  0.5f, 1f, 0.5f,
                  // Arriba
                  -0.5f, 1f, 0.5f,  0.5f, 1f, 0.5f,  0.5f, 1f, -0.5f,
                  -0.5f, 1f, 0.5f,  0.5f, 1f, -0.5f, -0.5f, 1f, -0.5f
              )

              override fun onSurfaceCreated(gl: GL10?, config: EGLConfig?) {
                  GLES20.glClearColor(0.45f, 0.68f, 0.90f, 1f)
                  GLES20.glEnable(GLES20.GL_DEPTH_TEST)

                  cubeBuffer = ByteBuffer.allocateDirect(cubeCoords.size * 4)
                      .order(ByteOrder.nativeOrder())
                      .asFloatBuffer()
                      .apply {
                          put(cubeCoords)
                          position(0)
                      }

                  val vs = """
                      uniform mat4 uMVPMatrix;
                      attribute vec4 vPosition;
                      void main() {
                          gl_Position = uMVPMatrix * vPosition;
                      }
                  """.trimIndent()

                  val fs = """
                      precision mediump float;
                      uniform vec4 vColor;
                      void main() {
                          gl_FragColor = vColor;
                      }
                  """.trimIndent()

                  val vShader = loadShader(GLES20.GL_VERTEX_SHADER, vs)
                  val fShader = loadShader(GLES20.GL_FRAGMENT_SHADER, fs)
                  program = GLES20.glCreateProgram().also {
                      GLES20.glAttachShader(it, vShader)
                      GLES20.glAttachShader(it, fShader)
                      GLES20.glLinkProgram(it)
                  }
                  posHandle = GLES20.glGetAttribLocation(program, "vPosition")
                  mvpHandle = GLES20.glGetUniformLocation(program, "uMVPMatrix")
                  colorHandle = GLES20.glGetUniformLocation(program, "vColor")
              }

              override fun onSurfaceChanged(gl: GL10?, width: Int, height: Int) {
                  GLES20.glViewport(0, 0, width, height)
                  val ratio = width.toFloat() / height.coerceAtLeast(1)
                  Matrix.perspectiveM(projMatrix, 0, 62f, ratio, 0.3f, 160f)
              }

              override fun onDrawFrame(gl: GL10?) {
                  GLES20.glClear(GLES20.GL_COLOR_BUFFER_BIT or GLES20.GL_DEPTH_BUFFER_BIT)
                  GLES20.glUseProgram(program)
                  GLES20.glEnableVertexAttribArray(posHandle)
                  GLES20.glVertexAttribPointer(posHandle, 3, GLES20.GL_FLOAT, false, 12, cubeBuffer)

                  synchronized(world) {
                      val lookDirX = -sin(world.playerYaw)
                      val lookDirZ = -cos(world.playerYaw)

                      val camX: Float
                      val camY: Float
                      val camZ: Float
                      val targetX: Float
                      val targetY: Float
                      val targetZ: Float

                      if (world.thirdPerson) {
                          camX = world.playerX - lookDirX * 4.2f
                          camY = 2.7f
                          camZ = world.playerZ - lookDirZ * 4.2f
                          targetX = world.playerX + lookDirX * 8f
                          targetY = 1.4f + world.playerPitch * 4f
                          targetZ = world.playerZ + lookDirZ * 8f
                      } else {
                          camX = world.playerX
                          camY = 1.65f
                          camZ = world.playerZ
                          targetX = world.playerX + lookDirX * 10f
                          targetY = 1.65f + world.playerPitch * 6f
                          targetZ = world.playerZ + lookDirZ * 10f
                      }

                      Matrix.setLookAtM(viewMatrix, 0, camX, camY, camZ, targetX, targetY, targetZ, 0f, 1f, 0f)
                      Matrix.multiplyMM(vpMatrix, 0, projMatrix, 0, viewMatrix, 0)

                      // Suelo isla
                      drawBox(0f, -0.2f, 0f, 92f, 0.2f, 92f, floatArrayOf(0.18f, 0.42f, 0.20f, 1f))
                      // Pistas/caminos
                      drawBox(0f, -0.18f, 0f, 4f, 0.2f, 88f, floatArrayOf(0.30f, 0.29f, 0.27f, 1f))
                      drawBox(0f, -0.18f, 0f, 88f, 0.2f, 4f, floatArrayOf(0.30f, 0.29f, 0.27f, 1f))

                      // Obstáculos y edificios
                      for (o in world.obstacles) {
                          drawBox(o.x, 0f, o.z, o.halfW * 2f, o.height, o.halfD * 2f, o.color)
                      }

                      // Jugador (si es 3ra persona)
                      if (world.thirdPerson) {
                          drawBox(world.playerX, 0f, world.playerZ, 0.8f, 1.3f, 0.8f, floatArrayOf(0.15f, 0.55f, 0.95f, 1f))
                          drawBox(world.playerX, 1.3f, world.playerZ, 0.55f, 0.55f, 0.55f, floatArrayOf(0.92f, 0.78f, 0.62f, 1f))
                      }

                      // Enemigos
                      for (e in world.enemies) {
                          drawBox(e.x, 0f, e.z, 0.85f, 1.35f, 0.85f, floatArrayOf(0.88f, 0.18f, 0.18f, 1f))
                          drawBox(e.x, 1.35f, e.z, 0.55f, 0.55f, 0.55f, floatArrayOf(0.95f, 0.80f, 0.65f, 1f))
                      }

                      // Botín
                      for (l in world.loots) {
                          val col = when (l.type) {
                              0 -> floatArrayOf(0.15f, 0.85f, 0.35f, 1f)
                              1 -> floatArrayOf(0.95f, 0.65f, 0.10f, 1f)
                              2 -> floatArrayOf(0.85f, 0.35f, 0.90f, 1f)
                              else -> floatArrayOf(0.20f, 0.80f, 0.95f, 1f)
                          }
                          drawBox(l.x, 0.1f, l.z, 0.7f, 0.7f, 0.7f, col)
                      }

                      // Proyectiles
                      for (p in world.projectiles) {
                          drawBox(p.x, p.y, p.z, 0.22f, 0.22f, 0.22f, floatArrayOf(1f, 0.92f, 0.2f, 1f))
                      }
                  }

                  GLES20.glDisableVertexAttribArray(posHandle)
              }

              private fun drawBox(x: Float, y: Float, z: Float, sx: Float, sy: Float, sz: Float, color: FloatArray) {
                  Matrix.setIdentityM(modelMatrix, 0)
                  Matrix.translateM(modelMatrix, 0, x, y, z)
                  Matrix.scaleM(modelMatrix, 0, sx, sy, sz)
                  Matrix.multiplyMM(mvpMatrix, 0, vpMatrix, 0, modelMatrix, 0)
                  GLES20.glUniformMatrix4fv(mvpHandle, 1, false, mvpMatrix, 0)
                  GLES20.glUniform4fv(colorHandle, 1, color, 0)
                  GLES20.glDrawArrays(GLES20.GL_TRIANGLES, 0, 30)
              }

              private fun loadShader(type: Int, code: String): Int {
                  return GLES20.glCreateShader(type).also { shader ->
                      GLES20.glShaderSource(shader, code)
                      GLES20.glCompileShader(shader)
                  }
              }
          }

          class HudOverlayView(context: Context, private val world: GameWorld) : View(context) {
              private var joyId = -1
              private var lookId = -1
              private var lastLookX = 0f
              private var lastLookY = 0f

              private var joyBaseX = 190f
              private var joyBaseY = 0f
              private var joyKnobX = 190f
              private var joyKnobY = 0f
              private val joyR = 105f

              private var fireX = 0f
              private var fireY = 0f
              private val fireR = 92f
              private var isFiring = false

              private var weaponBtnX = 0f
              private var weaponBtnY = 0f
              private var sprintBtnX = 0f
              private var sprintBtnY = 0f
              private var camBtnX = 0f
              private var camBtnY = 0f

              private val paintJoyBase = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor("#33FFFFFF") }
              private val paintJoyKnob = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor("#9938BDF8") }
              private val paintFire = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor("#BBEF4444") }
              private val paintBtn = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor("#881E293B") }
              private val paintCrosshair = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.WHITE
                  strokeWidth = 4f
              }
              private val paintHud = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.WHITE
                  textSize = 34f
              }
              private val paintBtnText = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.WHITE
                  textSize = 26f
                  textAlign = Paint.Align.CENTER
              }
              private val paintBanner = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.WHITE
                  textSize = 62f
                  textAlign = Paint.Align.CENTER
              }
              private val radarBg = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor("#990F172A") }
              private val radarZone = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#38BDF8")
                  style = Paint.Style.STROKE
                  strokeWidth = 3f
              }
              private val radarEnemy = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.RED }
              private val radarPlayer = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.GREEN }

              private val tickRunnable = object : Runnable {
                  override fun run() {
                      val moveRight = ((joyKnobX - joyBaseX) / joyR).coerceIn(-1f, 1f)
                      val moveForward = ((joyBaseY - joyKnobY) / joyR).coerceIn(-1f, 1f)
                      world.step(moveForward, moveRight)
                      if (isFiring) world.firePlayerWeapon()
                      invalidate()
                      postDelayed(this, 16)
                  }
              }

              init {
                  post(tickRunnable)
              }

              override fun onSizeChanged(w: Int, h: Int, oldw: Int, oldh: Int) {
                  joyBaseY = h - 190f
                  joyKnobX = joyBaseX
                  joyKnobY = joyBaseY

                  fireX = w - 180f
                  fireY = h - 190f

                  weaponBtnX = w - 360f
                  weaponBtnY = h - 130f

                  sprintBtnX = w - 180f
                  sprintBtnY = h - 360f

                  camBtnX = w - 360f
                  camBtnY = h - 260f
              }

              override fun onTouchEvent(event: MotionEvent): Boolean {
                  if (world.matchOver) {
                      if (event.actionMasked == MotionEvent.ACTION_DOWN) {
                          world.reset()
                      }
                      return true
                  }

                  val action = event.actionMasked
                  val idx = event.actionIndex
                  val id = event.getPointerId(idx)
                  val x = event.getX(idx)
                  val y = event.getY(idx)

                  when (action) {
                      MotionEvent.ACTION_DOWN, MotionEvent.ACTION_POINTER_DOWN -> {
                          when {
                              hypot((x - fireX).toDouble(), (y - fireY).toDouble()) <= fireR * 1.2f -> {
                                  isFiring = true
                                  world.firePlayerWeapon()
                              }
                              hypot((x - weaponBtnX).toDouble(), (y - weaponBtnY).toDouble()) <= 68f -> {
                                  world.cycleWeapon()
                              }
                              hypot((x - sprintBtnX).toDouble(), (y - sprintBtnY).toDouble()) <= 64f -> {
                                  world.isSprinting = !world.isSprinting
                              }
                              hypot((x - camBtnX).toDouble(), (y - camBtnY).toDouble()) <= 64f -> {
                                  world.thirdPerson = !world.thirdPerson
                              }
                              joyId == -1 && x < width * 0.45f -> {
                                  joyId = id
                                  updateJoy(x, y)
                              }
                              lookId == -1 && x >= width * 0.45f -> {
                                  lookId = id
                                  lastLookX = x
                                  lastLookY = y
                              }
                          }
                      }
                      MotionEvent.ACTION_MOVE -> {
                          for (p in 0 until event.pointerCount) {
                              val pid = event.getPointerId(p)
                              val px = event.getX(p)
                              val py = event.getY(p)
                              if (pid == joyId) {
                                  updateJoy(px, py)
                              } else if (pid == lookId) {
                                  val dx = px - lastLookX
                                  val dy = py - lastLookY
                                  lastLookX = px
                                  lastLookY = py
                                  world.playerYaw -= dx * 0.0065f
                                  world.playerPitch = (world.playerPitch - dy * 0.004f).coerceIn(-0.65f, 0.55f)
                              }
                          }
                      }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_POINTER_UP, MotionEvent.ACTION_CANCEL -> {
                          if (id == joyId) {
                              joyId = -1
                              joyKnobX = joyBaseX
                              joyKnobY = joyBaseY
                          }
                          if (id == lookId) {
                              lookId = -1
                          }
                          isFiring = false
                      }
                  }
                  return true
              }

              private fun updateJoy(tx: Float, ty: Float) {
                  val dx = tx - joyBaseX
                  val dy = ty - joyBaseY
                  val d = hypot(dx.toDouble(), dy.toDouble()).toFloat()
                  if (d <= joyR) {
                      joyKnobX = tx
                      joyKnobY = ty
                  } else if (d > 0f) {
                      joyKnobX = joyBaseX + dx / d * joyR
                      joyKnobY = joyBaseY + dy / d * joyR
                  }
              }

              override fun onDraw(canvas: Canvas) {
                  val cx = width / 2f
                  val cy = height / 2f

                  // Mira central
                  canvas.drawLine(cx - 18f, cy, cx + 18f, cy, paintCrosshair)
                  canvas.drawLine(cx, cy - 18f, cx, cy + 18f, paintCrosshair)

                  // Minimapa radar arriba a la derecha
                  val radarR = 95f
                  val radarCx = width - 125f
                  val radarCy = 120f
                  canvas.drawCircle(radarCx, radarCy, radarR, radarBg)
                  val scale = radarR / 50f
                  canvas.drawCircle(radarCx, radarCy, (world.zoneRadius * scale).coerceAtMost(radarR), radarZone)
                  for (e in world.enemies) {
                      canvas.drawCircle(radarCx + e.x * scale, radarCy + e.z * scale, 5f, radarEnemy)
                  }
                  canvas.drawCircle(radarCx + world.playerX * scale, radarCy + world.playerZ * scale, 6f, radarPlayer)

                  // Controles táctiles
                  canvas.drawCircle(joyBaseX, joyBaseY, joyR, paintJoyBase)
                  canvas.drawCircle(joyKnobX, joyKnobY, 42f, paintJoyKnob)

                  canvas.drawCircle(fireX, fireY, fireR, paintFire)
                  canvas.drawText("DISPARAR", fireX, fireY + 10f, paintBtnText)

                  canvas.drawCircle(weaponBtnX, weaponBtnY, 62f, paintBtn)
                  canvas.drawText("ARMA", weaponBtnX, weaponBtnY + 9f, paintBtnText)

                  canvas.drawCircle(sprintBtnX, sprintBtnY, 56f, paintBtn)
                  canvas.drawText(if (world.isSprinting) "CORRER ON" else "CORRER", sprintBtnX, sprintBtnY + 9f, paintBtnText)

                  canvas.drawCircle(camBtnX, camBtnY, 56f, paintBtn)
                  canvas.drawText(if (world.thirdPerson) "3RA PERS" else "1RA PERS", camBtnX, camBtnY + 9f, paintBtnText)

                  // HUD superior izquierdo
                  val alive = world.enemies.size + (if (world.hp > 0) 1 else 0)
                  canvas.drawText(
                      "HP: ${world.hp} | Escudo: ${world.shield} | Vivos: $alive | Bajas: ${world.kills}",
                      32f,
                      54f,
                      paintHud
                  )
                  canvas.drawText(
                      "Arma: ${world.weapon.label} | Balas: ${world.ammo}",
                      32f,
                      98f,
                      paintHud
                  )

                  if (world.matchOver) {
                      val title = if (world.victory) "¡VICTORIA CAMPAL!" else "ELIMINADO"
                      canvas.drawText(title, cx, cy - 25f, paintBanner)
                      canvas.drawText("Bajas: ${world.kills} — Toca la pantalla para reiniciar", cx, cy + 40f, paintHud)
                  }
              }
          }
          EOF

          python3 - << 'EOF'
          import os, struct, zlib
          def png(s):
              def ch(t, d): return struct.pack("!I", len(d)) + t + d + struct.pack("!I", zlib.crc32(t + d) & 0xFFFFFFFF)
              raw = (bytes([0]) + bytes([245, 158, 11, 255]) * s) * s
              return b"\x89PNG\r\n\x1a\n" + ch(b"IHDR", struct.pack("!IIBBBBB", s, s, 8, 6, 0, 0, 0)) + ch(b"IDAT", zlib.compress(raw)) + ch(b"IEND", b"")
          for d, px in {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}.items():
              p = f"br3d_app/app/src/main/res/mipmap-{d}"
              for n in ("ic_launcher.png", "ic_launcher_round.png"):
                  with open(f"{p}/{n}", "wb") as f: f.write(png(px))
          EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - run: gradle assembleDebug --stacktrace
        working-directory: br3d_app

      - run: cp br3d_app/app/build/outputs/apk/debug/app-debug.apk L.E.B-M-BR3D-v1.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: L.E.B-M-BR3D-v1.0
          path: L.E.B-M-BR3D-v1.0.apk
