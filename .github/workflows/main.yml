name: Build L.E.B-M BR 2018 APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create L.E.B-M BR 2018 Android project
        run: |
          rm -rf br_game_app
          mkdir -p br_game_app/app/src/main/java/com/leb/br2018 \
                   br_game_app/app/src/main/res/values \
                   br_game_app/app/src/main/res/mipmap-mdpi \
                   br_game_app/app/src/main/res/mipmap-hdpi \
                   br_game_app/app/src/main/res/mipmap-xhdpi \
                   br_game_app/app/src/main/res/mipmap-xxhdpi \
                   br_game_app/app/src/main/res/mipmap-xxxhdpi

          cat << 'EOF' > br_game_app/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LEBMBR2018"
          include(":app")
          EOF

          cat << 'EOF' > br_game_app/build.gradle
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat << 'EOF' > br_game_app/gradle.properties
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

          cat << 'EOF' > br_game_app/app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.leb.br2018'
              compileSdk 34

              defaultConfig {
                  applicationId "com.leb.br2018"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.13.1'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
          }
          EOF

          cat << 'EOF' > br_game_app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.Material3.Dark.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="landscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > br_game_app/app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">L.E.B-M Survival 2018</string>
          </resources>
          EOF

          cat << 'EOF' > br_game_app/app/src/main/java/com/leb/br2018/MainActivity.kt
          package com.leb.br2018

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.os.Bundle
          import android.view.MotionEvent
          import android.view.SurfaceHolder
          import android.view.SurfaceView
          import androidx.appcompat.app.AppCompatActivity
          import kotlin.math.atan2
          import kotlin.math.cos
          import kotlin.math.hypot
          import kotlin.math.sin
          import kotlin.random.Random

          data class BotEnemy(
              var x: Float,
              var y: Float,
              var hp: Int,
              var cooldown: Int
          )

          data class LootItem(
              val x: Float,
              val y: Float,
              val isMedkit: Boolean
          )

          data class Bullet(
              var x: Float,
              var y: Float,
              val vx: Float,
              val vy: Float,
              val fromPlayer: Boolean
          )

          class MainActivity : AppCompatActivity() {
              private lateinit var view: BattleRoyaleView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  view = BattleRoyaleView(this)
                  setContentView(view)
              }

              override fun onPause() {
                  super.onPause()
                  view.pauseLoop()
              }

              override fun onResume() {
                  super.onResume()
                  view.resumeLoop()
              }
          }

          class BattleRoyaleView(context: Context) : SurfaceView(context), SurfaceHolder.Callback, Runnable {
              private var thread: Thread? = null
              @Volatile private var running = false

              private var w = 0
              private var h = 0

              private var playerX = 0f
              private var playerY = 0f
              private var aimAngle = 0f
              private var hp = 100
              private var kills = 0
              private var matchOver = false
              private var victory = false
              private var fireCooldown = 0

              private var zoneRadius = 900f
              private var zoneCenterX = 0f
              private var zoneCenterY = 0f
              private var zoneDamageTick = 0

              private var joyPointerId = -1
              private val joyBaseX = 210f
              private var joyBaseY = 0f
              private var joyKnobX = 210f
              private var joyKnobY = 0f
              private val joyMaxRadius = 110f

              private var fireBtnX = 0f
              private var fireBtnY = 0f
              private val fireBtnRadius = 95f

              private val bots = mutableListOf<BotEnemy>()
              private val loots = mutableListOf<LootItem>()
              private val bullets = mutableListOf<Bullet>()

              private val groundPaint = Paint().apply { color = Color.parseColor("#14261A") }
              private val zonePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#38BDF8")
                  style = Paint.Style.STROKE
                  strokeWidth = 6f
              }
              private val playerPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor("#38BDF8") }
              private val botPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor("#EF4444") }
              private val medPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor("#22C55E") }
              private val ammoPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor("#F59E0B") }
              private val bulletPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor("#FEF08A") }
              private val joyBasePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#33FFFFFF")
                  style = Paint.Style.FILL
              }
              private val joyKnobPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#8838BDF8")
              }
              private val firePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#AAEF4444")
              }
              private val hudPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.WHITE
                  textSize = 36f
              }
              private val endPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.WHITE
                  textSize = 64f
                  textAlign = Paint.Align.CENTER
              }
              private val subEndPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#CBD5E1")
                  textSize = 34f
                  textAlign = Paint.Align.CENTER
              }

              init {
                  holder.addCallback(this)
              }

              override fun surfaceCreated(holder: SurfaceHolder) {
                  w = width
                  h = height
                  setupControls()
                  resetMatch()
                  resumeLoop()
              }

              override fun surfaceChanged(holder: SurfaceHolder, format: Int, width: Int, height: Int) {
                  w = width
                  h = height
                  setupControls()
              }

              override fun surfaceDestroyed(holder: SurfaceHolder) {
                  pauseLoop()
              }

              private fun setupControls() {
                  joyBaseY = (h - 210f).coerceAtLeast(180f)
                  joyKnobX = joyBaseX
                  joyKnobY = joyBaseY
                  fireBtnX = (w - 200f).coerceAtLeast(240f)
                  fireBtnY = (h - 210f).coerceAtLeast(180f)
              }

              fun resumeLoop() {
                  if (running) return
                  running = true
                  thread = Thread(this).also { it.start() }
              }

              fun pauseLoop() {
                  running = false
                  try {
                      thread?.join(500)
                  } catch (_: InterruptedException) { }
              }

              private fun resetMatch() {
                  hp = 100
                  kills = 0
                  matchOver = false
                  victory = false
                  fireCooldown = 0
                  zoneCenterX = w / 2f
                  zoneCenterY = h / 2f
                  zoneRadius = (minOf(w, h) * 0.46f).coerceAtLeast(280f)

                  playerX = zoneCenterX - 140f
                  playerY = zoneCenterY

                  bots.clear()
                  loots.clear()
                  bullets.clear()

                  for (i in 0 until 7) {
                      val angle = (i * 2.0 * Math.PI / 7.0).toFloat()
                      val bx = (zoneCenterX + cos(angle) * (zoneRadius * 0.65f)).coerceIn(80f, (w - 80f).coerceAtLeast(120f))
                      val by = (zoneCenterY + sin(angle) * (zoneRadius * 0.65f)).coerceIn(80f, (h - 80f).coerceAtLeast(120f))
                      bots.add(BotEnemy(bx, by, 60, Random.nextInt(40, 90)))
                  }

                  for (i in 0 until 6) {
                      val lx = Random.nextFloat() * (w - 160f).coerceAtLeast(120f) + 80f
                      val ly = Random.nextFloat() * (h - 160f).coerceAtLeast(120f) + 80f
                      loots.add(LootItem(lx, ly, isMedkit = (i % 2 == 0)))
                  }
              }

              override fun onTouchEvent(event: MotionEvent): Boolean {
                  if (matchOver) {
                      if (event.action == MotionEvent.ACTION_DOWN) {
                          resetMatch()
                      }
                      return true
                  }

                  val actionMasked = event.actionMasked
                  val idx = event.actionIndex
                  val x = event.getX(idx)
                  val y = event.getY(idx)
                  val id = event.getPointerId(idx)

                  when (actionMasked) {
                      MotionEvent.ACTION_DOWN, MotionEvent.ACTION_POINTER_DOWN -> {
                          if (hypot((x - fireBtnX).toDouble(), (y - fireBtnY).toDouble()) <= fireBtnRadius * 1.25f) {
                              tryFirePlayer()
                          } else if (joyPointerId == -1 && x < w * 0.55f) {
                              joyPointerId = id
                              updateJoystick(x, y)
                          } else {
                              aimAngle = atan2((y - playerY).toDouble(), (x - playerX).toDouble()).toFloat()
                          }
                      }
                      MotionEvent.ACTION_MOVE -> {
                          for (p in 0 until event.pointerCount) {
                              val pid = event.getPointerId(p)
                              val px = event.getX(p)
                              val py = event.getY(p)
                              if (pid == joyPointerId) {
                                  updateJoystick(px, py)
                              } else if (px >= w * 0.5f && hypot((px - fireBtnX).toDouble(), (py - fireBtnY).toDouble()) > fireBtnRadius * 1.3f) {
                                  aimAngle = atan2((py - playerY).toDouble(), (px - playerX).toDouble()).toFloat()
                              }
                          }
                      }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_POINTER_UP, MotionEvent.ACTION_CANCEL -> {
                          if (id == joyPointerId) {
                              joyPointerId = -1
                              joyKnobX = joyBaseX
                              joyKnobY = joyBaseY
                          }
                      }
                  }
                  return true
              }

              private fun updateJoystick(tx: Float, ty: Float) {
                  val dx = tx - joyBaseX
                  val dy = ty - joyBaseY
                  val dist = hypot(dx.toDouble(), dy.toDouble()).toFloat()
                  if (dist <= joyMaxRadius) {
                      joyKnobX = tx
                      joyKnobY = ty
                  } else if (dist > 0f) {
                      joyKnobX = joyBaseX + dx / dist * joyMaxRadius
                      joyKnobY = joyBaseY + dy / dist * joyMaxRadius
                  }
              }

              private fun tryFirePlayer() {
                  if (fireCooldown > 0) return
                  fireCooldown = 12
                  val speed = 22f
                  bullets.add(
                      Bullet(
                          playerX + cos(aimAngle) * 32f,
                          playerY + sin(aimAngle) * 32f,
                          cos(aimAngle) * speed,
                          sin(aimAngle) * speed,
                          fromPlayer = true
                      )
                  )
              }

              override fun run() {
                  while (running) {
                      if (!holder.surface.isValid) continue
                      update()
                      drawFrame()
                      try {
                          Thread.sleep(16)
                      } catch (_: InterruptedException) { }
                  }
              }

              private fun update() {
                  if (matchOver || w <= 0 || h <= 0) return

                  if (fireCooldown > 0) fireCooldown--

                  // Cierre progresivo de zona segura
                  if (zoneRadius > 130f) {
                      zoneRadius -= 0.14f
                  }

                  // Movimiento del jugador con joystick
                  val jdx = (joyKnobX - joyBaseX) / joyMaxRadius
                  val jdy = (joyKnobY - joyBaseY) / joyMaxRadius
                  val moveMag = hypot(jdx.toDouble(), jdy.toDouble()).toFloat()
                  if (moveMag > 0.12f) {
                      val speed = 6.5f
                      playerX = (playerX + jdx * speed).coerceIn(40f, (w - 40f).coerceAtLeast(80f))
                      playerY = (playerY + jdy * speed).coerceIn(40f, (h - 40f).coerceAtLeast(80f))
                      if (joyPointerId != -1) {
                          aimAngle = atan2(jdy.toDouble(), jdx.toDouble()).toFloat()
                      }
                  }

                  // Daño fuera de zona segura
                  val distFromZone = hypot((playerX - zoneCenterX).toDouble(), (playerY - zoneCenterY).toDouble()).toFloat()
                  if (distFromZone > zoneRadius) {
                      zoneDamageTick++
                      if (zoneDamageTick >= 25) {
                          zoneDamageTick = 0
                          hp -= 4
                      }
                  }

                  // Recoger botín
                  val lootIt = loots.iterator()
                  while (lootIt.hasNext()) {
                      val item = lootIt.next()
                      if (hypot((item.x - playerX).toDouble(), (item.y - playerY).toDouble()) <= 52f) {
                          if (item.isMedkit) {
                              hp = (hp + 30).coerceAtMost(100)
                          } else {
                              fireCooldown = 0
                          }
                          lootIt.remove()
                      }
                  }

                  // Actualizar bots
                  for (bot in bots) {
                      val dx = playerX - bot.x
                      val dy = playerY - bot.y
                      val d = hypot(dx.toDouble(), dy.toDouble()).toFloat().coerceAtLeast(1f)
                      if (d > 170f) {
                          bot.x = (bot.x + dx / d * 2.3f).coerceIn(40f, (w - 40f).coerceAtLeast(80f))
                          bot.y = (bot.y + dy / d * 2.3f).coerceIn(40f, (h - 40f).coerceAtLeast(80f))
                      }
                      bot.cooldown--
                      if (bot.cooldown <= 0 && d < 620f) {
                          bot.cooldown = Random.nextInt(55, 95)
                          val ang = atan2(dy.toDouble(), dx.toDouble()).toFloat()
                          bullets.add(Bullet(bot.x, bot.y, cos(ang) * 11f, sin(ang) * 11f, fromPlayer = false))
                      }
                  }

                  // Actualizar balas
                  val bIt = bullets.iterator()
                  while (bIt.hasNext()) {
                      val b = bIt.next()
                      b.x += b.vx
                      b.y += b.vy

                      if (b.x < -30f || b.x > w + 30f || b.y < -30f || b.y > h + 30f) {
                          bIt.remove()
                          continue
                      }

                      if (b.fromPlayer) {
                          var hitBot = false
                          val botIt = bots.iterator()
                          while (botIt.hasNext()) {
                              val bot = botIt.next()
                              if (hypot((b.x - bot.x).toDouble(), (b.y - bot.y).toDouble()) <= 34f) {
                                  bot.hp -= 25
                                  hitBot = true
                                  if (bot.hp <= 0) {
                                      botIt.remove()
                                      kills++
                                  }
                                  break
                              }
                          }
                          if (hitBot) {
                              bIt.remove()
                          }
                      } else {
                          if (hypot((b.x - playerX).toDouble(), (b.y - playerY).toDouble()) <= 30f) {
                              hp -= 12
                              bIt.remove()
                          }
                      }
                  }

                  if (hp <= 0) {
                      hp = 0
                      matchOver = true
                      victory = false
                  } else if (bots.isEmpty()) {
                      matchOver = true
                      victory = true
                  }
              }

              private fun drawFrame() {
                  val canvas: Canvas = holder.lockCanvas() ?: return
                  try {
                      canvas.drawRect(0f, 0f, w.toFloat(), h.toFloat(), groundPaint)
                      canvas.drawCircle(zoneCenterX, zoneCenterY, zoneRadius, zonePaint)

                      for (item in loots) {
                          canvas.drawCircle(item.x, item.y, 18f, if (item.isMedkit) medPaint else ammoPaint)
                      }

                      for (b in bullets) {
                          canvas.drawCircle(b.x, b.y, 8f, bulletPaint)
                      }

                      for (bot in bots) {
                          canvas.drawCircle(bot.x, bot.y, 26f, botPaint)
                      }

                      canvas.drawCircle(playerX, playerY, 28f, playerPaint)
                      canvas.drawLine(
                          playerX,
                          playerY,
                          playerX + cos(aimAngle) * 44f,
                          playerY + sin(aimAngle) * 44f,
                          playerPaint
                      )

                      // Controles táctiles
                      canvas.drawCircle(joyBaseX, joyBaseY, joyMaxRadius, joyBasePaint)
                      canvas.drawCircle(joyKnobX, joyKnobY, 42f, joyKnobPaint)
                      canvas.drawCircle(fireBtnX, fireBtnY, fireBtnRadius, firePaint)
                      canvas.drawText("DISPARAR", fireBtnX - 74f, fireBtnY + 12f, hudPaint)

                      // HUD superior
                      val alive = bots.size + (if (hp > 0) 1 else 0)
                      canvas.drawText("HP: $hp   Vivos: $alive   Bajas: $kills", 36f, 64f, hudPaint)

                      if (matchOver) {
                          val title = if (victory) "¡BOOYAH / VICTORIA!" else "ELIMINADO"
                          canvas.drawText(title, w / 2f, h / 2f - 20f, endPaint)
                          canvas.drawText("Bajas: $kills — Toca para jugar otra vez", w / 2f, h / 2f + 45f, subEndPaint)
                      }
                  } finally {
                      holder.unlockCanvasAndPost(canvas)
                  }
              }
          }
          EOF

          python3 - << 'EOF'
          import os, struct, zlib
          def png(s):
              def ch(t, d): return struct.pack("!I", len(d)) + t + d + struct.pack("!I", zlib.crc32(t + d) & 0xFFFFFFFF)
              raw = (bytes([0]) + bytes([245, 158, 11, 255]) * s) * s
              return b"\x89PNG\r\n\x1a\n" + ch(b"IHDR", struct.pack("!IIBBBBB", s, s, 8, 6, 0, 0, 0)) + ch(b"IDAT", zlib.compress(raw)) + ch(b"IEND", b"")
          for d, px in {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}.items():
              p = f"br_game_app/app/src/main/res/mipmap-{d}"
              for n in ("ic_launcher.png", "ic_launcher_round.png"):
                  with open(f"{p}/{n}", "wb") as f: f.write(png(px))
          EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - run: gradle assembleDebug --stacktrace
        working-directory: br_game_app

      - run: cp br_game_app/app/build/outputs/apk/debug/app-debug.apk L.E.B-M-BR2018-v1.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: L.E.B-M-BR2018-v1.0
          path: L.E.B-M-BR2018-v1.0.apk
