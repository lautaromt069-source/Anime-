name: Build L.E.B-M Battle Royale 3D v1.2 APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate new 3D Battle Royale project
        shell: bash
        run: |
          set -e
          rm -rf lebm_br3d_v12
          mkdir -p lebm_br3d_v12/app/src/main/java/com/lebm/royale3d \
                   lebm_br3d_v12/app/src/main/res/values \
                   lebm_br3d_v12/app/src/main/res/mipmap-mdpi \
                   lebm_br3d_v12/app/src/main/res/mipmap-hdpi \
                   lebm_br3d_v12/app/src/main/res/mipmap-xhdpi \
                   lebm_br3d_v12/app/src/main/res/mipmap-xxhdpi \
                   lebm_br3d_v12/app/src/main/res/mipmap-xxxhdpi

          cat > lebm_br3d_v12/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LEBMRoyale3D"
          include(":app")
          EOF

          cat > lebm_br3d_v12/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat > lebm_br3d_v12/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > lebm_br3d_v12/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.lebm.royale3d'
              compileSdk 34

              defaultConfig {
                  applicationId "com.lebm.royale3d"
                  minSdk 24
                  targetSdk 34
                  versionCode 3
                  versionName "1.2"
              }

              buildTypes {
                  release { minifyEnabled false }
                  debug { minifyEnabled false }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.13.1'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
          }
          EOF

          cat > lebm_br3d_v12/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:glEsVersion="0x00020000" android:required="true" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.Material3.Dark.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="landscape"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > lebm_br3d_v12/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">L.E.B-M Royale 3D</string>
          </resources>
          EOF

          cat > lebm_br3d_v12/app/src/main/java/com/lebm/royale3d/MainActivity.kt <<'EOF'
          package com.lebm.royale3d

          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.opengl.GLES20
          import android.opengl.GLSurfaceView
          import android.opengl.Matrix
          import android.os.Bundle
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.widget.Button
          import android.widget.FrameLayout
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import java.nio.ByteBuffer
          import java.nio.ByteOrder
          import java.nio.FloatBuffer
          import javax.microedition.khronos.egl.EGLConfig
          import javax.microedition.khronos.opengles.GL10
          import kotlin.math.abs
          import kotlin.math.cos
          import kotlin.math.hypot
          import kotlin.math.sin
          import kotlin.random.Random

          private data class StructureBlock(
              val cx: Float,
              val cz: Float,
              val widthX: Float,
              val depthZ: Float,
              val heightY: Float
          )

          private data class RivalUnit(
              var x: Float,
              var z: Float,
              var health: Int = 100,
              var stride: Float = 0f,
              var hitFlash: Int = 0
          )

          private data class SupplyDrop(
              val x: Float,
              val z: Float,
              val category: Int // 0 = botiquín, 1 = chaleco/escudo, 2 = munición
          )

          private data class TracerShot(
              var x: Float,
              var y: Float,
              var z: Float,
              val vx: Float,
              val vz: Float,
              var ttl: Int
          )

          private class ArenaSimulation {
              var playerX = 0f
              var playerZ = 16f
              var playerY = 0f
              var velY = 0f
              var heading = 0f

              var health = 100
              var armor = 60
              var ammo = 90
              var eliminations = 0

              var runningFast = false
              var triggerHeld = false
              var matchEnded = false
              var wonMatch = false

              var safeZoneRadius = 46f
              var frameCounter = 0
              var lastHitMarkerFrames = 0

              val structures = listOf(
                  StructureBlock(-14f, -10f, 8.5f, 7.5f, 5.4f),
                  StructureBlock(14f, -12f, 9.5f, 7.5f, 6.2f),
                  StructureBlock(0f, -26f, 11.0f, 8.0f, 6.8f),
                  StructureBlock(-19f, 12f, 7.0f, 8.0f, 4.8f),
                  StructureBlock(19f, 11f, 7.5f, 7.5f, 5.2f)
              )

              val rivals = mutableListOf<RivalUnit>()
              val supplies = mutableListOf<SupplyDrop>()
              val tracers = mutableListOf<TracerShot>()

              init {
                  startNewMatch()
              }

              @Synchronized
              fun startNewMatch() {
                  playerX = 0f
                  playerZ = 16f
                  playerY = 0f
                  velY = 0f
                  heading = 0f

                  health = 100
                  armor = 60
                  ammo = 90
                  eliminations = 0

                  runningFast = false
                  triggerHeld = false
                  matchEnded = false
                  wonMatch = false
                  safeZoneRadius = 46f
                  frameCounter = 0
                  lastHitMarkerFrames = 0

                  rivals.clear()
                  val enemySpots = listOf(
                      -22f to -19f, 22f to -21f, 0f to -35f,
                      -28f to 4f, 28f to 5f, -11f to -31f,
                      14f to -30f, 23f to 22f
                  )
                  for ((ex, ez) in enemySpots) {
                      rivals.add(RivalUnit(ex, ez, 100, Random.nextFloat() * 6.28f, 0))
                  }

                  supplies.clear()
                  supplies.addAll(
                      listOf(
                          SupplyDrop(3.5f, 11f, 0),
                          SupplyDrop(-3.5f, 11f, 1),
                          SupplyDrop(0f, 4f, 0),
                          SupplyDrop(-9f, -2f, 2),
                          SupplyDrop(9f, -5f, 0),
                          SupplyDrop(2f, -16f, 2)
                      )
                  )

                  tracers.clear()
              }

              @Synchronized
              fun jump() {
                  if (!matchEnded && playerY <= 0.01f) {
                      velY = 0.24f
                  }
              }

              @Synchronized
              fun tick(forwardInput: Float, strafeInput: Float) {
                  if (matchEnded) return
                  frameCounter++
                  if (lastHitMarkerFrames > 0) lastHitMarkerFrames--

                  if (safeZoneRadius > 14f && frameCounter % 15 == 0) {
                      safeZoneRadius -= 0.14f
                  }

                  // Física vertical (salto / gravedad)
                  if (playerY > 0f || velY > 0f) {
                      playerY += velY
                      velY -= 0.016f
                      if (playerY <= 0f) {
                          playerY = 0f
                          velY = 0f
                      }
                  }

                  // Desplazamiento horizontal
                  val moveSpeed = if (runningFast) 0.20f else 0.13f
                  val fwdX = -sin(heading)
                  val fwdZ = -cos(heading)
                  val rightX = cos(heading)
                  val rightZ = -sin(heading)

                  val deltaX = (fwdX * forwardInput + rightX * strafeInput) * moveSpeed
                  val deltaZ = (fwdZ * forwardInput + rightZ * strafeInput) * moveSpeed

                  val candX = (playerX + deltaX).coerceIn(-41f, 41f)
                  val candZ = (playerZ + deltaZ).coerceIn(-41f, 41f)
                  if (!hitsStructure(candX, playerZ)) playerX = candX
                  if (!hitsStructure(playerX, candZ)) playerZ = candZ

                  // Recolección de suministros
                  val sIt = supplies.iterator()
                  while (sIt.hasNext()) {
                      val item = sIt.next()
                      if (hypot((item.x - playerX).toDouble(), (item.z - playerZ).toDouble()) < 1.8) {
                          when (item.category) {
                              0 -> health = (health + 30).coerceAtMost(100)
                              1 -> armor = (armor + 35).coerceAtMost(100)
                              else -> ammo += 35
                          }
                          sIt.remove()
                      }
                  }

                  // Comportamiento de rivales
                  for (rival in rivals) {
                      rival.stride += 0.055f
                      if (rival.hitFlash > 0) rival.hitFlash--

                      val toPlayerX = playerX - rival.x
                      val toPlayerZ = playerZ - rival.z
                      val dist = hypot(toPlayerX.toDouble(), toPlayerZ.toDouble()).toFloat().coerceAtLeast(0.01f)

                      if (dist in 5.5f..30f) {
                          val stepX = rival.x + (toPlayerX / dist) * 0.042f
                          val stepZ = rival.z + (toPlayerZ / dist) * 0.042f
                          if (!hitsStructure(stepX, rival.z)) rival.x = stepX
                          if (!hitsStructure(rival.x, stepZ)) rival.z = stepZ
                      }

                      if (dist < 21f && frameCounter % 80 == 0) {
                          inflictPlayerDamage(3)
                      }
                  }

                  // Disparo del jugador
                  if (triggerHeld && ammo > 0 && frameCounter % 9 == 0) {
                      ammo--
                      val dirX = -sin(heading)
                      val dirZ = -cos(heading)
                      tracers.add(
                          TracerShot(
                              x = playerX + dirX * 1.1f,
                              y = playerY + 1.35f,
                              z = playerZ + dirZ * 1.1f,
                              vx = dirX * 1.45f,
                              vz = dirZ * 1.45f,
                              ttl = 18
                          )
                      )

                      val closestRival = rivals.minByOrNull {
                          hypot((it.x - playerX).toDouble(), (it.z - playerZ).toDouble())
                      }
                      if (closestRival != null) {
                          val dx = closestRival.x - playerX
                          val dz = closestRival.z - playerZ
                          val forwardProjection = dirX * dx + dirZ * dz
                          val perpDistance = abs(dirX * dz - dirZ * dx)
                          val totalDist = hypot(dx.toDouble(), dz.toDouble()).toFloat()

                          if (forwardProjection > 0f && totalDist < 26f && perpDistance < (1.15f + totalDist * 0.14f)) {
                              closestRival.health -= 25
                              closestRival.hitFlash = 5
                              lastHitMarkerFrames = 6
                              if (closestRival.health <= 0) {
                                  rivals.remove(closestRival)
                                  eliminations++
                              }
                          }
                      }
                  }

                  // Trazadoras
                  val tIt = tracers.iterator()
                  while (tIt.hasNext()) {
                      val tr = tIt.next()
                      tr.x += tr.vx
                      tr.z += tr.vz
                      tr.ttl--
                      if (tr.ttl <= 0 || hitsStructure(tr.x, tr.z)) {
                          tIt.remove()
                      }
                  }

                  // Daño por estar fuera de zona segura
                  if (hypot(playerX.toDouble(), playerZ.toDouble()) > safeZoneRadius && frameCounter % 36 == 0) {
                      inflictPlayerDamage(4)
                  }

                  if (health <= 0 || rivals.isEmpty()) {
                      matchEnded = true
                      wonMatch = health > 0 && rivals.isEmpty()
                  }
              }

              private fun inflictPlayerDamage(amount: Int) {
                  val blocked = minOf(armor, amount)
                  armor -= blocked
                  health = (health - (amount - blocked)).coerceAtLeast(0)
              }

              private fun hitsStructure(x: Float, z: Float): Boolean {
                  return structures.any {
                      val pad = 0.65f
                      x > it.cx - it.widthX / 2f - pad &&
                          x < it.cx + it.widthX / 2f + pad &&
                          z > it.cz - it.depthZ / 2f - pad &&
                          z < it.cz + it.depthZ / 2f + pad
                  }
              }
          }

          class MainActivity : AppCompatActivity() {
              private lateinit var glSurface: GLSurfaceView
              private val simulation = ArenaSimulation()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  @Suppress("DEPRECATION")
                  window.decorView.systemUiVisibility =
                      View.SYSTEM_UI_FLAG_FULLSCREEN or
                          View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY or
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE or
                          View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION or
                          View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN

                  val container = FrameLayout(this)
                  glSurface = GLSurfaceView(this).apply {
                      setEGLContextClientVersion(2)
                      setRenderer(IslandGLRenderer(simulation))
                      renderMode = GLSurfaceView.RENDERMODE_CONTINUOUSLY
                      preserveEGLContextOnPause = true
                  }

                  val hud = ArenaHudView(this, simulation)
                  container.addView(glSurface)
                  container.addView(hud)
                  setContentView(container)
              }

              override fun onPause() {
                  super.onPause()
                  glSurface.onPause()
              }

              override fun onResume() {
                  super.onResume()
                  glSurface.onResume()
              }
          }

          private class ArenaHudView(
              activity: AppCompatActivity,
              private val sim: ArenaSimulation
          ) : FrameLayout(activity) {

              private var movePointerId = -1
              private var cameraPointerId = -1

              private var stickOriginX = 150f
              private var stickOriginY = 0f
              private var stickThumbX = stickOriginX
              private var stickThumbY = 0f
              private val stickMaxRadius = 90f

              private var lastCamX = 0f
              private var inputForward = 0f
              private var inputStrafe = 0f

              private val statsView = TextView(activity).apply {
                  setTextColor(Color.WHITE)
                  textSize = 14.5f
                  setPadding(24, 16, 24, 14)
                  setBackgroundColor(0x771E293B.toInt())
              }

              private val btnFire = Button(activity).apply {
                  text = "DISPARAR"
                  textSize = 12f
              }
              private val btnJump = Button(activity).apply {
                  text = "SALTAR"
                  textSize = 11f
              }
              private val btnSprint = Button(activity).apply {
                  text = "CORRER"
                  textSize = 11f
              }
              private val btnRestart = Button(activity).apply {
                  text = "JUGAR DE NUEVO"
                  textSize = 13f
                  visibility = View.GONE
              }

              init {
                  setWillNotDraw(false)
                  addView(statsView, LayoutParams(LayoutParams.WRAP_CONTENT, LayoutParams.WRAP_CONTENT, Gravity.TOP or Gravity.START))
                  addView(btnFire, LayoutParams(148, 70, Gravity.RIGHT or Gravity.BOTTOM).apply { setMargins(0, 0, 36, 36) })
                  addView(btnJump, LayoutParams(124, 58, Gravity.RIGHT or Gravity.BOTTOM).apply { setMargins(0, 0, 198, 40) })
                  addView(btnSprint, LayoutParams(124, 58, Gravity.RIGHT or Gravity.BOTTOM).apply { setMargins(0, 0, 198, 112) })
                  addView(btnRestart, LayoutParams(250, 72, Gravity.CENTER))

                  btnFire.setOnTouchListener { _, ev ->
                      sim.triggerHeld = ev.action != MotionEvent.ACTION_UP && ev.action != MotionEvent.ACTION_CANCEL
                      true
                  }
                  btnJump.setOnClickListener { sim.jump() }
                  btnSprint.setOnClickListener {
                      sim.runningFast = !sim.runningFast
                      btnSprint.text = if (sim.runningFast) "CORRER: ON" else "CORRER"
                  }
                  btnRestart.setOnClickListener {
                      sim.startNewMatch()
                      btnRestart.visibility = View.GONE
                  }

                  post(object : Runnable {
                      override fun run() {
                          sim.tick(inputForward, inputStrafe)
                          statsView.text =
                              "L.E.B-M ROYALE 3D  v1.2\n" +
                                  "VIDA ${sim.health}  |  CHALECO ${sim.armor}  |  BALAS ${sim.ammo}\n" +
                                  "RIVALES ${sim.rivals.size}  |  BAJAS ${sim.eliminations}"

                          if (sim.matchEnded) {
                              btnRestart.visibility = View.VISIBLE
                              btnRestart.text = if (sim.wonMatch) "¡BOOYAH! REINTENTAR" else "ELIMINADO • REINTENTAR"
                          }
                          invalidate()
                          postDelayed(this, 16)
                      }
                  })
              }

              override fun onSizeChanged(w: Int, h: Int, oldw: Int, oldh: Int) {
                  super.onSizeChanged(w, h, oldw, oldh)
                  stickOriginX = 150f
                  stickOriginY = (h - 145f).coerceAtLeast(120f)
                  stickThumbX = stickOriginX
                  stickThumbY = stickOriginY
              }

              override fun onTouchEvent(event: MotionEvent): Boolean {
                  if (sim.matchEnded) return true

                  when (event.actionMasked) {
                      MotionEvent.ACTION_DOWN, MotionEvent.ACTION_POINTER_DOWN -> {
                          val idx = event.actionIndex
                          val pid = event.getPointerId(idx)
                          val tx = event.getX(idx)
                          val ty = event.getY(idx)

                          if (tx < width * 0.44f && movePointerId == -1) {
                              movePointerId = pid
                              updateStick(tx, ty)
                          } else if (tx >= width * 0.44f && cameraPointerId == -1) {
                              cameraPointerId = pid
                              lastCamX = tx
                          }
                      }

                      MotionEvent.ACTION_MOVE -> {
                          for (p in 0 until event.pointerCount) {
                              val pid = event.getPointerId(p)
                              val tx = event.getX(p)
                              val ty = event.getY(p)
                              if (pid == movePointerId) {
                                  updateStick(tx, ty)
                              } else if (pid == cameraPointerId) {
                                  sim.heading -= (tx - lastCamX) * 0.0062f
                                  lastCamX = tx
                              }
                          }
                      }

                      MotionEvent.ACTION_UP, MotionEvent.ACTION_POINTER_UP, MotionEvent.ACTION_CANCEL -> {
                          val pid = event.getPointerId(event.actionIndex)
                          if (pid == movePointerId) {
                              movePointerId = -1
                              inputForward = 0f
                              inputStrafe = 0f
                              stickThumbX = stickOriginX
                              stickThumbY = stickOriginY
                          }
                          if (pid == cameraPointerId) {
                              cameraPointerId = -1
                          }
                      }
                  }
                  return true
              }

              private fun updateStick(tx: Float, ty: Float) {
                  var dx = tx - stickOriginX
                  var dy = ty - stickOriginY
                  val dist = hypot(dx.toDouble(), dy.toDouble()).toFloat()
                  if (dist > stickMaxRadius) {
                      dx *= stickMaxRadius / dist
                      dy *= stickMaxRadius / dist
                  }
                  stickThumbX = stickOriginX + dx
                  stickThumbY = stickOriginY + dy
                  inputStrafe = (dx / stickMaxRadius).coerceIn(-1f, 1f)
                  inputForward = (-dy / stickMaxRadius).coerceIn(-1f, 1f)
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)

                  // Joystick izquierdo
                  val ringPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = 0x66FFFFFF.toInt()
                      style = Paint.Style.STROKE
                      strokeWidth = 4f
                  }
                  canvas.drawCircle(stickOriginX, stickOriginY, stickMaxRadius, ringPaint)

                  val thumbPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = 0xAA38BDF8.toInt()
                      style = Paint.Style.FILL
                  }
                  canvas.drawCircle(stickThumbX, stickThumbY, 36f, thumbPaint)

                  // Mira central
                  val midX = width / 2f
                  val midY = height / 2f
                  val aimColor = if (sim.lastHitMarkerFrames > 0) Color.RED else Color.WHITE
                  val aimPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = aimColor
                      strokeWidth = 3.5f
                  }
                  canvas.drawLine(midX - 16f, midY, midX + 16f, midY, aimPaint)
                  canvas.drawLine(midX, midY - 16f, midX, midY + 16f, aimPaint)

                  // Minimapa circular arriba a la derecha
                  val mapRadius = 86f
                  val mapCx = width - 115f
                  val mapCy = 108f
                  canvas.drawCircle(mapCx, mapCy, mapRadius, Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = 0x990F172A.toInt()
                  })
                  val scale = mapRadius / 48f
                  canvas.drawCircle(
                      mapCx,
                      mapCy,
                      (sim.safeZoneRadius * scale).coerceAtMost(mapRadius),
                      Paint(Paint.ANTI_ALIAS_FLAG).apply {
                          color = 0xFF38BDF8.toInt()
                          style = Paint.Style.STROKE
                          strokeWidth = 2.5f
                      }
                  )
                  for (rival in sim.rivals) {
                      canvas.drawCircle(
                          mapCx + rival.x * scale,
                          mapCy + rival.z * scale,
                          4.5f,
                          Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.RED }
                      )
                  }
                  canvas.drawCircle(
                      mapCx + sim.playerX * scale,
                      mapCy + sim.playerZ * scale,
                      5.5f,
                      Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.GREEN }
                  )
              }
          }

          private class IslandGLRenderer(private val sim: ArenaSimulation) : GLSurfaceView.Renderer {
              private var shaderProg = 0
              private var attrPos = 0
              private var attrNorm = 0
              private var uniMvp = 0
              private var uniModel = 0
              private var uniColor = 0

              private var boxVbo: FloatBuffer? = null
              private var domeVbo: FloatBuffer? = null
              private var domeVertexCount = 0

              private val projMat = FloatArray(16)
              private val viewMat = FloatArray(16)
              private val vpMat = FloatArray(16)
              private val modelMat = FloatArray(16)
              private val mvpMat = FloatArray(16)
              private var tickAnim = 0

              override fun onSurfaceCreated(gl: GL10?, config: EGLConfig?) {
                  GLES20.glClearColor(0.50f, 0.74f, 0.92f, 1f)
                  GLES20.glEnable(GLES20.GL_DEPTH_TEST)
                  GLES20.glEnable(GLES20.GL_BLEND)
                  GLES20.glBlendFunc(GLES20.GL_SRC_ALPHA, GLES20.GL_ONE_MINUS_SRC_ALPHA)

                  val vertexSrc = """
                      uniform mat4 uMVP;
                      uniform mat4 uModel;
                      attribute vec3 aPos;
                      attribute vec3 aNorm;
                      varying float vShade;
                      void main() {
                          vec3 worldN = normalize(mat3(uModel) * aNorm);
                          vec3 sunDir = normalize(vec3(-0.4, 0.85, 0.35));
                          vShade = 0.45 + 0.55 * max(dot(worldN, sunDir), 0.0);
                          gl_Position = uMVP * vec4(aPos, 1.0);
                      }
                  """.trimIndent()

                  val fragmentSrc = """
                      precision mediump float;
                      uniform vec4 uColor;
                      varying float vShade;
                      void main() {
                          gl_FragColor = vec4(uColor.rgb * vShade, uColor.a);
                      }
                  """.trimIndent()

                  val vs = compileShader(GLES20.GL_VERTEX_SHADER, vertexSrc)
                  val fs = compileShader(GLES20.GL_FRAGMENT_SHADER, fragmentSrc)
                  shaderProg = GLES20.glCreateProgram().also {
                      GLES20.glAttachShader(it, vs)
                      GLES20.glAttachShader(it, fs)
                      GLES20.glLinkProgram(it)
                  }

                  attrPos = GLES20.glGetAttribLocation(shaderProg, "aPos")
                  attrNorm = GLES20.glGetAttribLocation(shaderProg, "aNorm")
                  uniMvp = GLES20.glGetUniformLocation(shaderProg, "uMVP")
                  uniModel = GLES20.glGetUniformLocation(shaderProg, "uModel")
                  uniColor = GLES20.glGetUniformLocation(shaderProg, "uColor")

                  boxVbo = toFloatBuffer(buildUnitBox())
                  val dome = buildDome(12, 16)
                  domeVbo = toFloatBuffer(dome.first)
                  domeVertexCount = dome.second
              }

              override fun onSurfaceChanged(gl: GL10?, width: Int, height: Int) {
                  GLES20.glViewport(0, 0, width, height)
                  val aspect = width.toFloat() / height.coerceAtLeast(1)
                  Matrix.perspectiveM(projMat, 0, 60f, aspect, 0.25f, 160f)
              }

              override fun onDrawFrame(gl: GL10?) {
                  GLES20.glClear(GLES20.GL_COLOR_BUFFER_BIT or GLES20.GL_DEPTH_BUFFER_BIT)
                  GLES20.glUseProgram(shaderProg)
                  GLES20.glEnableVertexAttribArray(attrPos)
                  GLES20.glEnableVertexAttribArray(attrNorm)

                  synchronized(sim) {
                      val dirX = -sin(sim.heading)
                      val dirZ = -cos(sim.heading)
                      val camX = sim.playerX - dirX * 5.0f
                      val camY = sim.playerY + 3.4f
                      val camZ = sim.playerZ - dirZ * 5.0f

                      Matrix.setLookAtM(
                          viewMat, 0,
                          camX, camY, camZ,
                          sim.playerX + dirX * 5.5f, sim.playerY + 1.2f, sim.playerZ + dirZ * 5.5f,
                          0f, 1f, 0f
                      )
                      Matrix.multiplyMM(vpMat, 0, projMat, 0, viewMat, 0)

                      // Terreno y calles principales
                      renderBox(0f, -0.35f, 0f, 96f, 0.5f, 96f, floatArrayOf(0.22f, 0.44f, 0.21f, 1f))
                      renderBox(0f, -0.08f, 0f, 4.8f, 0.08f, 92f, floatArrayOf(0.38f, 0.36f, 0.30f, 1f))
                      renderBox(0f, -0.07f, 0f, 92f, 0.08f, 4.8f, floatArrayOf(0.38f, 0.36f, 0.30f, 1f))

                      // Edificios con techo y puerta
                      for (b in sim.structures) {
                          renderBox(b.cx, b.heightY / 2f, b.cz, b.widthX, b.heightY, b.depthZ, floatArrayOf(0.50f, 0.52f, 0.54f, 1f))
                          renderBox(b.cx, b.heightY + 0.16f, b.cz, b.widthX + 0.5f, 0.32f, b.depthZ + 0.5f, floatArrayOf(0.30f, 0.22f, 0.18f, 1f))
                          renderBox(b.cx, 0.9f, b.cz + b.depthZ / 2f + 0.03f, 1.0f, 1.8f, 0.08f, floatArrayOf(0.20f, 0.14f, 0.10f, 1f))
                      }

                      // Árboles en los bordes
                      for (gx in -4..4) {
                          for (gz in -4..4) {
                              val tx = gx * 9.5f + if (gz % 2 == 0) 2.5f else -2.5f
                              val tz = gz * 9.5f - 2.0f
                              if (abs(tx) > 23f || abs(tz) > 23f) {
                                  renderTree(tx, tz)
                              }
                          }
                      }

                      // Suministros en el suelo
                      for (item in sim.supplies) {
                          val col = when (item.category) {
                              0 -> floatArrayOf(0.15f, 0.85f, 0.35f, 1f)
                              1 -> floatArrayOf(0.18f, 0.65f, 0.95f, 1f)
                              else -> floatArrayOf(0.95f, 0.72f, 0.15f, 1f)
                          }
                          renderDome(item.x, 0.5f, item.z, 0.42f, 0.48f, 0.42f, col)
                      }

                      // Trazadoras de balas
                      for (tr in sim.tracers) {
                          renderBox(tr.x, tr.y, tr.z, 0.18f, 0.18f, 0.65f, floatArrayOf(1.0f, 0.92f, 0.25f, 1f))
                      }

                      // Rivales y jugador
                      for (rival in sim.rivals) {
                          val col = if (rival.hitFlash > 0) {
                              floatArrayOf(1.0f, 0.9f, 0.2f, 1f)
                          } else {
                              floatArrayOf(0.82f, 0.20f, 0.18f, 1f)
                          }
                          renderCharacter(rival.x, 0f, rival.z, 0.92f, rival.stride, col)
                      }

                      renderCharacter(
                          sim.playerX,
                          sim.playerY,
                          sim.playerZ,
                          1.0f,
                          tickAnim * 0.08f,
                          floatArrayOf(0.14f, 0.48f, 0.88f, 1f)
                      )
                      tickAnim++
                  }

                  GLES20.glDisableVertexAttribArray(attrPos)
                  GLES20.glDisableVertexAttribArray(attrNorm)
              }

              private fun renderTree(x: Float, z: Float) {
                  renderBox(x, 1.0f, z, 0.44f, 2.0f, 0.44f, floatArrayOf(0.32f, 0.20f, 0.10f, 1f))
                  renderDome(x, 2.5f, z, 1.25f, 1.4f, 1.25f, floatArrayOf(0.14f, 0.40f, 0.17f, 1f))
              }

              private fun renderCharacter(x: Float, y: Float, z: Float, scale: Float, phase: Float, bodyColor: FloatArray) {
                  val armSwing = sin(phase) * 0.22f
                  renderBox(x - 0.20f * scale, y + 0.42f * scale, z, 0.22f * scale, 0.78f * scale, 0.24f * scale, floatArrayOf(0.14f, 0.17f, 0.22f, 1f))
                  renderBox(x + 0.20f * scale, y + 0.42f * scale, z, 0.22f * scale, 0.78f * scale, 0.24f * scale, floatArrayOf(0.14f, 0.17f, 0.22f, 1f))
                  renderBox(x, y + 1.24f * scale, z, 0.82f * scale, 0.86f * scale, 0.42f * scale, bodyColor)
                  renderBox(x - 0.54f * scale, y + 1.20f * scale + armSwing, z, 0.22f * scale, 0.72f * scale, 0.22f * scale, bodyColor)
                  renderBox(x + 0.54f * scale, y + 1.20f * scale - armSwing, z, 0.22f * scale, 0.72f * scale, 0.22f * scale, bodyColor)
                  renderDome(x, y + 1.92f * scale, z, 0.28f * scale, 0.30f * scale, 0.28f * scale, floatArrayOf(0.80f, 0.65f, 0.52f, 1f))
              }

              private fun renderBox(x: Float, y: Float, z: Float, sx: Float, sy: Float, sz: Float, color: FloatArray) {
                  drawMesh(boxVbo!!, 36, x, y, z, sx, sy, sz, color)
              }

              private fun renderDome(x: Float, y: Float, z: Float, sx: Float, sy: Float, sz: Float, color: FloatArray) {
                  drawMesh(domeVbo!!, domeVertexCount, x, y, z, sx, sy, sz, color)
              }

              private fun drawMesh(buf: FloatBuffer, count: Int, x: Float, y: Float, z: Float, sx: Float, sy: Float, sz: Float, color: FloatArray) {
                  Matrix.setIdentityM(modelMat, 0)
                  Matrix.translateM(modelMat, 0, x, y, z)
                  Matrix.scaleM(modelMat, 0, sx, sy, sz)
                  Matrix.multiplyMM(mvpMat, 0, vpMat, 0, modelMat, 0)

                  GLES20.glUniformMatrix4fv(uniMvp, 1, false, mvpMat, 0)
                  GLES20.glUniformMatrix4fv(uniModel, 1, false, modelMat, 0)
                  GLES20.glUniform4fv(uniColor, 1, color, 0)

                  buf.position(0)
                  GLES20.glVertexAttribPointer(attrPos, 3, GLES20.GL_FLOAT, false, 24, buf)
                  buf.position(3)
                  GLES20.glVertexAttribPointer(attrNorm, 3, GLES20.GL_FLOAT, false, 24, buf)
                  GLES20.glDrawArrays(GLES20.GL_TRIANGLES, 0, count)
              }

              private fun compileShader(type: Int, code: String): Int {
                  val s = GLES20.glCreateShader(type)
                  GLES20.glShaderSource(s, code)
                  GLES20.glCompileShader(s)
                  val status = IntArray(1)
                  GLES20.glGetShaderiv(s, GLES20.GL_COMPILE_STATUS, status, 0)
                  if (status[0] == 0) {
                      throw IllegalStateException(GLES20.glGetShaderInfoLog(s))
                  }
                  return s
              }

              private fun toFloatBuffer(arr: FloatArray): FloatBuffer =
                  ByteBuffer.allocateDirect(arr.size * 4).order(ByteOrder.nativeOrder()).asFloatBuffer().apply {
                      put(arr)
                      position(0)
                  }

              private fun buildUnitBox(): FloatArray {
                  val list = ArrayList<Float>()
                  fun quad(a: FloatArray, b: FloatArray, c: FloatArray, d: FloatArray, n: FloatArray) {
                      for (v in listOf(a, b, c, a, c, d)) {
                          for (f in v) list.add(f)
                          for (f in n) list.add(f)
                      }
                  }
                  quad(floatArrayOf(-.5f, 0f, .5f), floatArrayOf(.5f, 0f, .5f), floatArrayOf(.5f, 1f, .5f), floatArrayOf(-.5f, 1f, .5f), floatArrayOf(0f, 0f, 1f))
                  quad(floatArrayOf(.5f, 0f, -.5f), floatArrayOf(-.5f, 0f, -.5f), floatArrayOf(-.5f, 1f, -.5f), floatArrayOf(.5f, 1f, -.5f), floatArrayOf(0f, 0f, -1f))
                  quad(floatArrayOf(-.5f, 0f, -.5f), floatArrayOf(-.5f, 0f, .5f), floatArrayOf(-.5f, 1f, .5f), floatArrayOf(-.5f, 1f, -.5f), floatArrayOf(-1f, 0f, 0f))
                  quad(floatArrayOf(.5f, 0f, .5f), floatArrayOf(.5f, 0f, -.5f), floatArrayOf(.5f, 1f, -.5f), floatArrayOf(.5f, 1f, .5f), floatArrayOf(1f, 0f, 0f))
                  quad(floatArrayOf(-.5f, 1f, .5f), floatArrayOf(.5f, 1f, .5f), floatArrayOf(.5f, 1f, -.5f), floatArrayOf(-.5f, 1f, -.5f), floatArrayOf(0f, 1f, 0f))
                  quad(floatArrayOf(-.5f, 0f, -.5f), floatArrayOf(.5f, 0f, -.5f), floatArrayOf(.5f, 0f, .5f), floatArrayOf(-.5f, 0f, .5f), floatArrayOf(0f, -1f, 0f))
                  return list.toFloatArray()
              }

              private fun buildDome(rings: Int, sectors: Int): Pair<FloatArray, Int> {
                  val out = ArrayList<Float>()
                  fun push(pt: FloatArray) {
                      for (f in pt) out.add(f)
                      for (f in pt) out.add(f)
                  }
                  for (r in 0 until rings) {
                      val t0 = Math.PI * r / rings
                      val t1 = Math.PI * (r + 1) / rings
                      for (s in 0 until sectors) {
                          val p0 = 2.0 * Math.PI * s / sectors
                          val p1 = 2.0 * Math.PI * (s + 1) / sectors
                          fun pt(th: Double, ph: Double) = floatArrayOf(
                              (sin(th) * cos(ph)).toFloat(),
                              cos(th).toFloat(),
                              (sin(th) * sin(ph)).toFloat()
                          )
                          val a = pt(t0, p0)
                          val b = pt(t1, p0)
                          val c = pt(t1, p1)
                          val d = pt(t0, p1)
                          push(a); push(b); push(c); push(a); push(c); push(d)
                      }
                  }
                  return Pair(out.toFloatArray(), rings * sectors * 6)
              }
          }
          EOF

          python3 - <<'PY'
          import os, struct, zlib
          def make_png(size):
              def chunk(tag, payload):
                  return struct.pack("!I", len(payload)) + tag + payload + struct.pack("!I", zlib.crc32(tag + payload) & 0xffffffff)
              row = bytes([0]) + bytes([30, 144, 255, 255]) * size
              raw = row * size
              return b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack("!IIBBBBB", size, size, 8, 6, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(raw)) + chunk(b"IEND", b"")
          for density, px in {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}.items():
              target_dir = f"lebm_br3d_v12/app/src/main/res/mipmap-{density}"
              os.makedirs(target_dir, exist_ok=True)
              for icon_name in ("ic_launcher.png", "ic_launcher_round.png"):
                  with open(os.path.join(target_dir, icon_name), "wb") as fh:
                      fh.write(make_png(px))
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Assemble debug APK
        run: gradle assembleDebug --stacktrace
        working-directory: lebm_br3d_v12

      - name: Package APK artifact
        run: cp lebm_br3d_v12/app/build/outputs/apk/debug/app-debug.apk L.E.B-M-BR3D-v1.2.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: L.E.B-M-BR3D-v1.2
          path: L.E.B-M-BR3D-v1.2.apk
          if-no-files-found: error
