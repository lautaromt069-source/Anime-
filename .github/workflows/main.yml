name: Build L.E.B-M Royale 3D v1.3 APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate L.E.B-M Royale 3D v1.3 project
        shell: bash
        run: |
          set -e
          rm -rf lebm_royale_v13
          mkdir -p lebm_royale_v13/app/src/main/java/com/lebm/royale3d \
                   lebm_royale_v13/app/src/main/res/values \
                   lebm_royale_v13/app/src/main/res/mipmap-mdpi \
                   lebm_royale_v13/app/src/main/res/mipmap-hdpi \
                   lebm_royale_v13/app/src/main/res/mipmap-xhdpi \
                   lebm_royale_v13/app/src/main/res/mipmap-xxhdpi \
                   lebm_royale_v13/app/src/main/res/mipmap-xxxhdpi

          cat > lebm_royale_v13/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LEBMRoyale3D"
          include(":app")
          EOF

          cat > lebm_royale_v13/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat > lebm_royale_v13/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > lebm_royale_v13/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.lebm.royale3d'
              compileSdk 34

              defaultConfig {
                  applicationId "com.lebm.royale3d"
                  minSdk 24
                  targetSdk 34
                  versionCode 4
                  versionName "1.3"
              }

              buildTypes {
                  release { minifyEnabled false }
                  debug { minifyEnabled false }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.13.1'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
          }
          EOF

          cat > lebm_royale_v13/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:glEsVersion="0x00020000" android:required="true" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.Material3.Dark.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="landscape"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > lebm_royale_v13/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">L.E.B-M Royale 3D</string>
          </resources>
          EOF

          cat > lebm_royale_v13/app/src/main/java/com/lebm/royale3d/MainActivity.kt <<'EOF'
          package com.lebm.royale3d

          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.opengl.GLES20
          import android.opengl.GLSurfaceView
          import android.opengl.Matrix
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.widget.Button
          import android.widget.FrameLayout
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import java.nio.ByteBuffer
          import java.nio.ByteOrder
          import java.nio.FloatBuffer
          import javax.microedition.khronos.egl.EGLConfig
          import javax.microedition.khronos.opengles.GL10
          import kotlin.math.abs
          import kotlin.math.cos
          import kotlin.math.hypot
          import kotlin.math.sin
          import kotlin.random.Random

          private enum class GunMode(
              val title: String,
              val damage: Int,
              val fireIntervalFrames: Int,
              val shotsPerPull: Int,
              val maxRange: Float
          ) {
              RIFLE("RIFLE AR", 24, 8, 1, 28f),
              SHOTGUN("ESCOPETA", 17, 24, 4, 15f)
          }

          private data class WorldBlock(
              val cx: Float,
              val cz: Float,
              val w: Float,
              val d: Float,
              val h: Float,
              val climbable: Boolean
          )

          private data class BotFighter(
              var x: Float,
              var z: Float,
              var hp: Int = 100,
              var phase: Float = 0f,
              var flashFrames: Int = 0
          )

          private data class CrateDrop(
              val x: Float,
              val z: Float,
              val kind: Int // 0 = botiquín, 1 = chaleco, 2 = balas
          )

          private data class ShotBeam(
              var x: Float,
              var y: Float,
              var z: Float,
              val vx: Float,
              val vz: Float,
              var life: Int
          )

          private class BattleEngine {
              var px = 0f
              var pz = 16f
              var py = 0f
              var vy = 0f
              var yaw = 0f

              var hp = 100
              var armor = 60
              var ammo = 100
              var kills = 0
              var gun = GunMode.RIFLE

              var sprint = false
              var firing = false
              var gameOver = false
              var won = false

              var zoneRadius = 46f
              var tick = 0
              var hitFlash = 0

              val blocks = listOf(
                  WorldBlock(-14f, -10f, 8.5f, 7.5f, 5.4f, climbable = false),
                  WorldBlock(14f, -12f, 9.5f, 7.5f, 6.2f, climbable = false),
                  WorldBlock(0f, -26f, 11.0f, 8.0f, 6.8f, climbable = false),
                  WorldBlock(-19f, 12f, 7.0f, 8.0f, 4.8f, climbable = false),
                  WorldBlock(19f, 11f, 7.5f, 7.5f, 5.2f, climbable = false),
                  WorldBlock(-5f, 5f, 2.2f, 2.2f, 1.3f, climbable = true),
                  WorldBlock(6f, 4f, 2.2f, 2.2f, 1.3f, climbable = true),
                  WorldBlock(0f, -8f, 2.4f, 2.4f, 1.4f, climbable = true)
              )

              val bots = mutableListOf<BotFighter>()
              val drops = mutableListOf<CrateDrop>()
              val beams = mutableListOf<ShotBeam>()

              init {
                  resetMatch()
              }

              @Synchronized
              fun resetMatch() {
                  px = 0f
                  pz = 16f
                  py = 0f
                  vy = 0f
                  yaw = 0f

                  hp = 100
                  armor = 60
                  ammo = 100
                  kills = 0
                  gun = GunMode.RIFLE

                  sprint = false
                  firing = false
                  gameOver = false
                  won = false
                  zoneRadius = 46f
                  tick = 0
                  hitFlash = 0

                  bots.clear()
                  listOf(
                      -22f to -19f, 22f to -21f, 0f to -35f,
                      -28f to 4f, 28f to 5f, -11f to -31f,
                      14f to -30f, 23f to 22f
                  ).forEach { (bx, bz) ->
                      bots.add(BotFighter(bx, bz, 100, Random.nextFloat() * 6.28f, 0))
                  }

                  drops.clear()
                  drops.addAll(
                      listOf(
                          CrateDrop(3.5f, 11f, 0),
                          CrateDrop(-3.5f, 11f, 1),
                          CrateDrop(0f, 3f, 0),
                          CrateDrop(-9f, -2f, 2),
                          CrateDrop(9f, -5f, 0),
                          CrateDrop(2f, -16f, 2)
                      )
                  )
                  beams.clear()
              }

              @Synchronized
              fun triggerJump() {
                  if (!gameOver && py <= 0.02f) {
                      vy = 0.25f
                  }
              }

              @Synchronized
              fun switchGun() {
                  gun = if (gun == GunMode.RIFLE) GunMode.SHOTGUN else GunMode.RIFLE
              }

              @Synchronized
              fun step(moveForward: Float, moveRight: Float) {
                  if (gameOver) return
                  tick++
                  if (hitFlash > 0) hitFlash--
                  if (zoneRadius > 14f && tick % 16 == 0) {
                      zoneRadius -= 0.13f
                  }

                  // Física de salto y soporte sobre cajas bajas
                  val floorHeight = currentSupportHeight(px, pz)
                  if (py > floorHeight || vy > 0f) {
                      py += vy
                      vy -= 0.017f
                      if (py <= floorHeight) {
                          py = floorHeight
                          vy = 0f
                      }
                  } else {
                      py = floorHeight
                  }

                  val speed = if (sprint) 0.20f else 0.13f
                  val fx = -sin(yaw)
                  val fz = -cos(yaw)
                  val rx = cos(yaw)
                  val rz = -sin(yaw)

                  val dx = (fx * moveForward + rx * moveRight) * speed
                  val dz = (fz * moveForward + rz * moveRight) * speed

                  val nextX = (px + dx).coerceIn(-41f, 41f)
                  val nextZ = (pz + dz).coerceIn(-41f, 41f)
                  if (!blockedAt(nextX, pz, py)) px = nextX
                  if (!blockedAt(px, nextZ, py)) pz = nextZ

                  // Recoger suministros
                  val dIt = drops.iterator()
                  while (dIt.hasNext()) {
                      val item = dIt.next()
                      if (hypot((item.x - px).toDouble(), (item.z - pz).toDouble()) < 1.8) {
                          when (item.kind) {
                              0 -> hp = (hp + 30).coerceAtMost(100)
                              1 -> armor = (armor + 35).coerceAtMost(100)
                              else -> ammo += 35
                          }
                          dIt.remove()
                      }
                  }

                  // IA de rivales
                  for (bot in bots) {
                      bot.phase += 0.055f
                      if (bot.flashFrames > 0) bot.flashFrames--
                      val toX = px - bot.x
                      val toZ = pz - bot.z
                      val dist = hypot(toX.toDouble(), toZ.toDouble()).toFloat().coerceAtLeast(0.01f)
                      if (dist in 5.5f..30f) {
                          val bx = bot.x + (toX / dist) * 0.042f
                          val bz = bot.z + (toZ / dist) * 0.042f
                          if (!blockedAt(bx, bot.z, 0f)) bot.x = bx
                          if (!blockedAt(bot.x, bz, 0f)) bot.z = bz
                      }
                      if (dist < 21f && tick % 82 == 0) {
                          takeDamage(3)
                      }
                  }

                  // Disparo del jugador
                  if (firing && ammo > 0 && tick % gun.fireIntervalFrames == 0) {
                      ammo--
                      val dirX = -sin(yaw)
                      val dirZ = -cos(yaw)
                      repeat(gun.shotsPerPull) {
                          val jitter = (Random.nextFloat() - 0.5f) * if (gun == GunMode.SHOTGUN) 0.16f else 0.04f
                          val ang = yaw + jitter
                          beams.add(
                              ShotBeam(
                                  x = px - sin(ang) * 1.1f,
                                  y = py + 1.35f,
                                  z = pz - cos(ang) * 1.1f,
                                  vx = -sin(ang) * 1.45f,
                                  vz = -cos(ang) * 1.45f,
                                  life = 16
                              )
                          )
                      }

                      for (bot in bots.toList()) {
                          val bx = bot.x - px
                          val bz = bot.z - pz
                          val along = dirX * bx + dirZ * bz
                          val lateral = abs(dirX * bz - dirZ * bx)
                          val d = hypot(bx.toDouble(), bz.toDouble()).toFloat()
                          val coneWidth = if (gun == GunMode.SHOTGUN) (1.8f + d * 0.24f) else (1.1f + d * 0.13f)
                          if (along > 0f && d <= gun.maxRange && lateral <= coneWidth) {
                              bot.hp -= gun.damage
                              bot.flashFrames = 5
                              hitFlash = 5
                              if (bot.hp <= 0) {
                                  bots.remove(bot)
                                  kills++
                              }
                              if (gun == GunMode.RIFLE) break
                          }
                      }
                  }

                  // Trazadoras
                  val bIt = beams.iterator()
                  while (bIt.hasNext()) {
                      val bm = bIt.next()
                      bm.x += bm.vx
                      bm.z += bm.vz
                      bm.life--
                      if (bm.life <= 0 || blockedAt(bm.x, bm.z, bm.y)) {
                          bIt.remove()
                      }
                  }

                  // Zona segura
                  if (hypot(px.toDouble(), pz.toDouble()) > zoneRadius && tick % 36 == 0) {
                      takeDamage(4)
                  }

                  if (hp <= 0 || bots.isEmpty()) {
                      gameOver = true
                      won = hp > 0 && bots.isEmpty()
                  }
              }

              private fun takeDamage(dmg: Int) {
                  val blocked = minOf(armor, dmg)
                  armor -= blocked
                  hp = (hp - (dmg - blocked)).coerceAtLeast(0)
              }

              private fun currentSupportHeight(x: Float, z: Float): Float {
                  var top = 0f
                  for (b in blocks) {
                      if (b.climbable &&
                          abs(x - b.cx) <= b.w / 2f + 0.35f &&
                          abs(z - b.cz) <= b.d / 2f + 0.35f &&
                          py >= b.h - 0.25f
                      ) {
                          if (b.h > top) top = b.h
                      }
                  }
                  return top
              }

              private fun blockedAt(x: Float, z: Float, feetY: Float): Boolean {
                  val pad = 0.62f
                  for (b in blocks) {
                      if (x + pad > b.cx - b.w / 2f &&
                          x - pad < b.cx + b.w / 2f &&
                          z + pad > b.cz - b.d / 2f &&
                          z - pad < b.cz + b.d / 2f
                      ) {
                          if (!(b.climbable && feetY >= b.h - 0.15f)) {
                              return true
                          }
                      }
                  }
                  return false
              }
          }

          class MainActivity : AppCompatActivity() {
              private lateinit var glView: GLSurfaceView
              private lateinit var hud: BattleHudLayout
              private val engine = BattleEngine()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  @Suppress("DEPRECATION")
                  window.decorView.systemUiVisibility =
                      View.SYSTEM_UI_FLAG_FULLSCREEN or
                          View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY or
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE or
                          View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION or
                          View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN

                  val container = FrameLayout(this)
                  glView = GLSurfaceView(this).apply {
                      setEGLContextClientVersion(2)
                      setRenderer(RoyaleRenderer(engine))
                      renderMode = GLSurfaceView.RENDERMODE_CONTINUOUSLY
                      preserveEGLContextOnPause = true
                  }
                  hud = BattleHudLayout(this, engine)
                  container.addView(glView)
                  container.addView(hud)
                  setContentView(container)
              }

              override fun onPause() {
                  super.onPause()
                  hud.stopLoop()
                  glView.onPause()
              }

              override fun onResume() {
                  super.onResume()
                  glView.onResume()
                  hud.startLoop()
              }
          }

          private class BattleHudLayout(
              activity: AppCompatActivity,
              private val engine: BattleEngine
          ) : FrameLayout(activity) {

              private val mainHandler = Handler(Looper.getMainLooper())
              private var loopActive = false

              private var stickPid = -1
              private var lookPid = -1

              private var stickCx = 150f
              private var stickCy = 0f
              private var stickKx = stickCx
              private var stickKy = 0f
              private val stickRadius = 88f

              private var prevLookX = 0f
              private var fwdAxis = 0f
              private var rightAxis = 0f

              private val hudBox = TextView(activity).apply {
                  setTextColor(Color.WHITE)
                  textSize = 14f
                  setPadding(22, 14, 22, 12)
                  setBackgroundColor(0x771E293B.toInt())
              }

              private val fireBtn = Button(activity).apply { text = "DISPARAR"; textSize = 12f }
              private val jumpBtn = Button(activity).apply { text = "SALTAR"; textSize = 11f }
              private val gunBtn = Button(activity).apply { text = "ARMA"; textSize = 11f }
              private val sprintBtn = Button(activity).apply { text = "CORRER"; textSize = 11f }
              private val retryBtn = Button(activity).apply {
                  text = "JUGAR DE NUEVO"
                  textSize = 13f
                  visibility = View.GONE
              }

              private val frameTicker = object : Runnable {
                  override fun run() {
                      if (!loopActive) return
                      engine.step(fwdAxis, rightAxis)
                      hudBox.text =
                          "L.E.B-M ROYALE 3D  v1.3  [${engine.gun.title}]\n" +
                              "VIDA ${engine.hp}  |  CHALECO ${engine.armor}  |  BALAS ${engine.ammo}\n" +
                              "RIVALES ${engine.bots.size}  |  BAJAS ${engine.kills}"

                      if (engine.gameOver) {
                          retryBtn.visibility = View.VISIBLE
                          retryBtn.text = if (engine.won) "¡VICTORIA! REINTENTAR" else "ELIMINADO • REINTENTAR"
                      }
                      invalidate()
                      mainHandler.postDelayed(this, 16)
                  }
              }

              init {
                  setWillNotDraw(false)
                  addView(hudBox, LayoutParams(LayoutParams.WRAP_CONTENT, LayoutParams.WRAP_CONTENT, Gravity.TOP or Gravity.START))
                  addView(fireBtn, LayoutParams(150, 70, Gravity.RIGHT or Gravity.BOTTOM).apply { setMargins(0, 0, 36, 36) })
                  addView(jumpBtn, LayoutParams(124, 56, Gravity.RIGHT or Gravity.BOTTOM).apply { setMargins(0, 0, 200, 38) })
                  addView(gunBtn, LayoutParams(124, 56, Gravity.RIGHT or Gravity.BOTTOM).apply { setMargins(0, 0, 200, 106) })
                  addView(sprintBtn, LayoutParams(124, 56, Gravity.RIGHT or Gravity.BOTTOM).apply { setMargins(0, 0, 36, 118) })
                  addView(retryBtn, LayoutParams(250, 72, Gravity.CENTER))

                  fireBtn.setOnTouchListener { _, ev ->
                      engine.firing = ev.action != MotionEvent.ACTION_UP && ev.action != MotionEvent.ACTION_CANCEL
                      true
                  }
                  jumpBtn.setOnClickListener { engine.triggerJump() }
                  gunBtn.setOnClickListener { engine.switchGun() }
                  sprintBtn.setOnClickListener {
                      engine.sprint = !engine.sprint
                      sprintBtn.text = if (engine.sprint) "CORRER: ON" else "CORRER"
                  }
                  retryBtn.setOnClickListener {
                      engine.resetMatch()
                      retryBtn.visibility = View.GONE
                  }
              }

              fun startLoop() {
                  if (loopActive) return
                  loopActive = true
                  mainHandler.post(frameTicker)
              }

              fun stopLoop() {
                  loopActive = false
                  mainHandler.removeCallbacks(frameTicker)
              }

              override fun onSizeChanged(w: Int, h: Int, oldw: Int, oldh: Int) {
                  super.onSizeChanged(w, h, oldw, oldh)
                  stickCx = 150f
                  stickCy = (h - 145f).coerceAtLeast(120f)
                  stickKx = stickCx
                  stickKy = stickCy
              }

              override fun onTouchEvent(event: MotionEvent): Boolean {
                  if (engine.gameOver) return true

                  when (event.actionMasked) {
                      MotionEvent.ACTION_DOWN, MotionEvent.ACTION_POINTER_DOWN -> {
                          val idx = event.actionIndex
                          val pid = event.getPointerId(idx)
                          val x = event.getX(idx)
                          val y = event.getY(idx)
                          if (x < width * 0.44f && stickPid == -1) {
                              stickPid = pid
                              moveStick(x, y)
                          } else if (x >= width * 0.44f && lookPid == -1) {
                              lookPid = pid
                              prevLookX = x
                          }
                      }

                      MotionEvent.ACTION_MOVE -> {
                          for (p in 0 until event.pointerCount) {
                              val pid = event.getPointerId(p)
                              val x = event.getX(p)
                              val y = event.getY(p)
                              if (pid == stickPid) {
                                  moveStick(x, y)
                              } else if (pid == lookPid) {
                                  engine.yaw -= (x - prevLookX) * 0.0062f
                                  prevLookX = x
                              }
                          }
                      }

                      MotionEvent.ACTION_UP, MotionEvent.ACTION_POINTER_UP, MotionEvent.ACTION_CANCEL -> {
                          val pid = event.getPointerId(event.actionIndex)
                          if (pid == stickPid) {
                              stickPid = -1
                              fwdAxis = 0f
                              rightAxis = 0f
                              stickKx = stickCx
                              stickKy = stickCy
                          }
                          if (pid == lookPid) {
                              lookPid = -1
                          }
                      }
                  }
                  return true
              }

              private fun moveStick(tx: Float, ty: Float) {
                  var dx = tx - stickCx
                  var dy = ty - stickCy
                  val dist = hypot(dx.toDouble(), dy.toDouble()).toFloat()
                  if (dist > stickRadius) {
                      dx *= stickRadius / dist
                      dy *= stickRadius / dist
                  }
                  stickKx = stickCx + dx
                  stickKy = stickCy + dy
                  rightAxis = (dx / stickRadius).coerceIn(-1f, 1f)
                  fwdAxis = (-dy / stickRadius).coerceIn(-1f, 1f)
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)

                  // Joystick izquierdo
                  canvas.drawCircle(
                      stickCx, stickCy, stickRadius,
                      Paint(Paint.ANTI_ALIAS_FLAG).apply {
                          color = 0x66FFFFFF.toInt()
                          style = Paint.Style.STROKE
                          strokeWidth = 4f
                      }
                  )
                  canvas.drawCircle(
                      stickKx, stickKy, 35f,
                      Paint(Paint.ANTI_ALIAS_FLAG).apply { color = 0xAA38BDF8.toInt() }
                  )

                  // Mira central con marcador de impacto
                  val midX = width / 2f
                  val midY = height / 2f
                  val crossPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = if (engine.hitFlash > 0) Color.RED else Color.WHITE
                      strokeWidth = 3.5f
                  }
                  canvas.drawLine(midX - 16f, midY, midX + 16f, midY, crossPaint)
                  canvas.drawLine(midX, midY - 16f, midX, midY + 16f, crossPaint)

                  // Minimapa radar arriba a la derecha
                  val rMap = 84f
                  val cxMap = width - 112f
                  val cyMap = 104f
                  canvas.drawCircle(cxMap, cyMap, rMap, Paint(Paint.ANTI_ALIAS_FLAG).apply { color = 0x990F172A.toInt() })
                  val sc = rMap / 48f
                  canvas.drawCircle(
                      cxMap, cyMap, (engine.zoneRadius * sc).coerceAtMost(rMap),
                      Paint(Paint.ANTI_ALIAS_FLAG).apply {
                          color = 0xFF38BDF8.toInt()
                          style = Paint.Style.STROKE
                          strokeWidth = 2.5f
                      }
                  )
                  for (bot in engine.bots) {
                      canvas.drawCircle(
                          cxMap + bot.x * sc, cyMap + bot.z * sc, 4.5f,
                          Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.RED }
                      )
                  }
                  canvas.drawCircle(
                      cxMap + engine.px * sc, cyMap + engine.pz * sc, 5.5f,
                      Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.GREEN }
                  )
              }
          }

          private class RoyaleRenderer(private val engine: BattleEngine) : GLSurfaceView.Renderer {
              private var prog = 0
              private var aPos = 0
              private var aNorm = 0
              private var uMvp = 0
              private var uModel = 0
              private var uColor = 0

              private var boxBuf: FloatBuffer? = null
              private var sphereBuf: FloatBuffer? = null
              private var sphereVerts = 0

              private val pMat = FloatArray(16)
              private val vMat = FloatArray(16)
              private val vpMat = FloatArray(16)
              private val mMat = FloatArray(16)
              private val mvpMat = FloatArray(16)
              private var animStep = 0

              override fun onSurfaceCreated(gl: GL10?, config: EGLConfig?) {
                  GLES20.glClearColor(0.50f, 0.74f, 0.92f, 1f)
                  GLES20.glEnable(GLES20.GL_DEPTH_TEST)
                  GLES20.glEnable(GLES20.GL_BLEND)
                  GLES20.glBlendFunc(GLES20.GL_SRC_ALPHA, GLES20.GL_ONE_MINUS_SRC_ALPHA)

                  val vsCode = """
                      uniform mat4 uMVP;
                      uniform mat4 uModel;
                      attribute vec3 aPos;
                      attribute vec3 aNorm;
                      varying float vLight;
                      void main() {
                          vec3 wn = normalize(mat3(uModel) * aNorm);
                          vec3 sun = normalize(vec3(-0.4, 0.85, 0.35));
                          vLight = 0.45 + 0.55 * max(dot(wn, sun), 0.0);
                          gl_Position = uMVP * vec4(aPos, 1.0);
                      }
                  """.trimIndent()

                  val fsCode = """
                      precision mediump float;
                      uniform vec4 uColor;
                      varying float vLight;
                      void main() {
                          gl_FragColor = vec4(uColor.rgb * vLight, uColor.a);
                      }
                  """.trimIndent()

                  val vs = makeShader(GLES20.GL_VERTEX_SHADER, vsCode)
                  val fs = makeShader(GLES20.GL_FRAGMENT_SHADER, fsCode)
                  prog = GLES20.glCreateProgram().also {
                      GLES20.glAttachShader(it, vs)
                      GLES20.glAttachShader(it, fs)
                      GLES20.glLinkProgram(it)
                  }

                  aPos = GLES20.glGetAttribLocation(prog, "aPos")
                  aNorm = GLES20.glGetAttribLocation(prog, "aNorm")
                  uMvp = GLES20.glGetUniformLocation(prog, "uMVP")
                  uModel = GLES20.glGetUniformLocation(prog, "uModel")
                  uColor = GLES20.glGetUniformLocation(prog, "uColor")

                  boxBuf = toBuf(unitBox())
                  val sp = unitSphere(12, 16)
                  sphereBuf = toBuf(sp.first)
                  sphereVerts = sp.second
              }

              override fun onSurfaceChanged(gl: GL10?, width: Int, height: Int) {
                  GLES20.glViewport(0, 0, width, height)
                  Matrix.perspectiveM(pMat, 0, 60f, width.toFloat() / height.coerceAtLeast(1), 0.25f, 160f)
              }

              override fun onDrawFrame(gl: GL10?) {
                  GLES20.glClear(GLES20.GL_COLOR_BUFFER_BIT or GLES20.GL_DEPTH_BUFFER_BIT)
                  GLES20.glUseProgram(prog)
                  GLES20.glEnableVertexAttribArray(aPos)
                  GLES20.glEnableVertexAttribArray(aNorm)

                  synchronized(engine) {
                      val dx = -sin(engine.yaw)
                      val dz = -cos(engine.yaw)
                      val camX = engine.px - dx * 5.0f
                      val camY = engine.py + 3.4f
                      val camZ = engine.pz - dz * 5.0f

                      Matrix.setLookAtM(
                          vMat, 0,
                          camX, camY, camZ,
                          engine.px + dx * 5.5f, engine.py + 1.2f, engine.pz + dz * 5.5f,
                          0f, 1f, 0f
                      )
                      Matrix.multiplyMM(vpMat, 0, pMat, 0, vMat, 0)

                      // Suelo y caminos
                      drawBox(0f, -0.35f, 0f, 96f, 0.5f, 96f, floatArrayOf(0.22f, 0.44f, 0.21f, 1f))
                      drawBox(0f, -0.08f, 0f, 4.8f, 0.08f, 92f, floatArrayOf(0.38f, 0.36f, 0.30f, 1f))
                      drawBox(0f, -0.07f, 0f, 92f, 0.08f, 4.8f, floatArrayOf(0.38f, 0.36f, 0.30f, 1f))

                      // Edificios y cajas
                      for (b in engine.blocks) {
                          if (b.climbable) {
                              drawBox(b.cx, 0f, b.cz, b.w, b.h, b.d, floatArrayOf(0.56f, 0.39f, 0.21f, 1f))
                          } else {
                              drawBox(b.cx, 0f, b.cz, b.w, b.h, b.d, floatArrayOf(0.50f, 0.52f, 0.54f, 1f))
                              drawBox(b.cx, b.h, b.cz, b.w + 0.5f, 0.32f, b.d + 0.5f, floatArrayOf(0.30f, 0.22f, 0.18f, 1f))
                          }
                      }

                      // Árboles
                      for (gx in -4..4) {
                          for (gz in -4..4) {
                              val tx = gx * 9.5f + if (gz % 2 == 0) 2.5f else -2.5f
                              val tz = gz * 9.5f - 2.0f
                              if (abs(tx) > 23f || abs(tz) > 23f) {
                                  drawBox(tx, 0f, tz, 0.44f, 2.0f, 0.44f, floatArrayOf(0.32f, 0.20f, 0.10f, 1f))
                                  drawSphere(tx, 2.5f, tz, 1.25f, 1.4f, 1.25f, floatArrayOf(0.14f, 0.40f, 0.17f, 1f))
                              }
                          }
                      }

                      // Suministros
                      for (item in engine.drops) {
                          val col = when (item.kind) {
                              0 -> floatArrayOf(0.15f, 0.85f, 0.35f, 1f)
                              1 -> floatArrayOf(0.18f, 0.65f, 0.95f, 1f)
                              else -> floatArrayOf(0.95f, 0.72f, 0.15f, 1f)
                          }
                          drawSphere(item.x, 0.5f, item.z, 0.42f, 0.48f, 0.42f, col)
                      }

                      // Trazadoras
                      for (bm in engine.beams) {
                          drawBox(bm.x, bm.y - 0.09f, bm.z, 0.18f, 0.18f, 0.65f, floatArrayOf(1.0f, 0.92f, 0.25f, 1f))
                      }

                      // Rivales y jugador
                      for (bot in engine.bots) {
                          val col = if (bot.flashFrames > 0) floatArrayOf(1.0f, 0.9f, 0.2f, 1f) else floatArrayOf(0.82f, 0.20f, 0.18f, 1f)
                          drawFighter(bot.x, 0f, bot.z, 0.92f, bot.phase, col)
                      }
                      drawFighter(engine.px, engine.py, engine.pz, 1.0f, animStep * 0.08f, floatArrayOf(0.14f, 0.48f, 0.88f, 1f))
                      animStep++
                  }

                  GLES20.glDisableVertexAttribArray(aPos)
                  GLES20.glDisableVertexAttribArray(aNorm)
              }

              private fun drawFighter(x: Float, y: Float, z: Float, s: Float, phase: Float, bodyCol: FloatArray) {
                  val swing = sin(phase) * 0.22f
                  drawBox(x - 0.20f * s, y, z, 0.22f * s, 0.78f * s, 0.24f * s, floatArrayOf(0.14f, 0.17f, 0.22f, 1f))
                  drawBox(x + 0.20f * s, y, z, 0.22f * s, 0.78f * s, 0.24f * s, floatArrayOf(0.14f, 0.17f, 0.22f, 1f))
                  drawBox(x, y + 0.80f * s, z, 0.82f * s, 0.86f * s, 0.42f * s, bodyCol)
                  drawBox(x - 0.54f * s, y + 0.82f * s + swing, z, 0.22f * s, 0.72f * s, 0.22f * s, bodyCol)
                  drawBox(x + 0.54f * s, y + 0.82f * s - swing, z, 0.22f * s, 0.72f * s, 0.22f * s, bodyCol)
                  drawSphere(x, y + 1.92f * s, z, 0.28f * s, 0.30f * s, 0.28f * s, floatArrayOf(0.80f, 0.65f, 0.52f, 1f))
              }

              private fun drawBox(x: Float, y: Float, z: Float, sx: Float, sy: Float, sz: Float, col: FloatArray) {
                  renderMesh(boxBuf!!, 36, x, y, z, sx, sy, sz, col)
              }

              private fun drawSphere(x: Float, y: Float, z: Float, sx: Float, sy: Float, sz: Float, col: FloatArray) {
                  renderMesh(sphereBuf!!, sphereVerts, x, y, z, sx, sy, sz, col)
              }

              private fun renderMesh(buf: FloatBuffer, count: Int, x: Float, y: Float, z: Float, sx: Float, sy: Float, sz: Float, col: FloatArray) {
                  Matrix.setIdentityM(mMat, 0)
                  Matrix.translateM(mMat, 0, x, y, z)
                  Matrix.scaleM(mMat, 0, sx, sy, sz)
                  Matrix.multiplyMM(mvpMat, 0, vpMat, 0, mMat, 0)

                  GLES20.glUniformMatrix4fv(uMvp, 1, false, mvpMat, 0)
                  GLES20.glUniformMatrix4fv(uModel, 1, false, mMat, 0)
                  GLES20.glUniform4fv(uColor, 1, col, 0)

                  buf.position(0)
                  GLES20.glVertexAttribPointer(aPos, 3, GLES20.GL_FLOAT, false, 24, buf)
                  buf.position(3)
                  GLES20.glVertexAttribPointer(aNorm, 3, GLES20.GL_FLOAT, false, 24, buf)
                  GLES20.glDrawArrays(GLES20.GL_TRIANGLES, 0, count)
              }

              private fun makeShader(type: Int, src: String): Int {
                  val s = GLES20.glCreateShader(type)
                  GLES20.glShaderSource(s, src)
                  GLES20.glCompileShader(s)
                  val ok = IntArray(1)
                  GLES20.glGetShaderiv(s, GLES20.GL_COMPILE_STATUS, ok, 0)
                  if (ok[0] == 0) throw IllegalStateException(GLES20.glGetShaderInfoLog(s))
                  return s
              }

              private fun toBuf(arr: FloatArray): FloatBuffer =
                  ByteBuffer.allocateDirect(arr.size * 4).order(ByteOrder.nativeOrder()).asFloatBuffer().apply {
                      put(arr)
                      position(0)
                  }

              private fun unitBox(): FloatArray {
                  val out = ArrayList<Float>()
                  fun face(a: FloatArray, b: FloatArray, c: FloatArray, d: FloatArray, n: FloatArray) {
                      for (v in listOf(a, b, c, a, c, d)) {
                          for (f in v) out.add(f)
                          for (f in n) out.add(f)
                      }
                  }
                  face(floatArrayOf(-.5f, 0f, .5f), floatArrayOf(.5f, 0f, .5f), floatArrayOf(.5f, 1f, .5f), floatArrayOf(-.5f, 1f, .5f), floatArrayOf(0f, 0f, 1f))
                  face(floatArrayOf(.5f, 0f, -.5f), floatArrayOf(-.5f, 0f, -.5f), floatArrayOf(-.5f, 1f, -.5f), floatArrayOf(.5f, 1f, -.5f), floatArrayOf(0f, 0f, -1f))
                  face(floatArrayOf(-.5f, 0f, -.5f), floatArrayOf(-.5f, 0f, .5f), floatArrayOf(-.5f, 1f, .5f), floatArrayOf(-.5f, 1f, -.5f), floatArrayOf(-1f, 0f, 0f))
                  face(floatArrayOf(.5f, 0f, .5f), floatArrayOf(.5f, 0f, -.5f), floatArrayOf(.5f, 1f, -.5f), floatArrayOf(.5f, 1f, .5f), floatArrayOf(1f, 0f, 0f))
                  face(floatArrayOf(-.5f, 1f, .5f), floatArrayOf(.5f, 1f, .5f), floatArrayOf(.5f, 1f, -.5f), floatArrayOf(-.5f, 1f, -.5f), floatArrayOf(0f, 1f, 0f))
                  face(floatArrayOf(-.5f, 0f, -.5f), floatArrayOf(.5f, 0f, -.5f), floatArrayOf(.5f, 0f, .5f), floatArrayOf(-.5f, 0f, .5f), floatArrayOf(0f, -1f, 0f))
                  return out.toFloatArray()
              }

              private fun unitSphere(rings: Int, sectors: Int): Pair<FloatArray, Int> {
                  val out = ArrayList<Float>()
                  fun push(p: FloatArray) {
                      for (f in p) out.add(f)
                      for (f in p) out.add(f)
                  }
                  for (r in 0 until rings) {
                      val t0 = Math.PI * r / rings
                      val t1 = Math.PI * (r + 1) / rings
                      for (s in 0 until sectors) {
                          val p0 = 2.0 * Math.PI * s / sectors
                          val p1 = 2.0 * Math.PI * (s + 1) / sectors
                          fun pt(th: Double, ph: Double) = floatArrayOf(
                              (sin(th) * cos(ph)).toFloat(),
                              cos(th).toFloat(),
                              (sin(th) * sin(ph)).toFloat()
                          )
                          val a = pt(t0, p0); val b = pt(t1, p0); val c = pt(t1, p1); val d = pt(t0, p1)
                          push(a); push(b); push(c); push(a); push(c); push(d)
                      }
                  }
                  return Pair(out.toFloatArray(), rings * sectors * 6)
              }
          }
          EOF

          python3 - <<'PY'
          import os, struct, zlib
          def make_png(size):
              def chunk(tag, payload):
                  return struct.pack("!I", len(payload)) + tag + payload + struct.pack("!I", zlib.crc32(tag + payload) & 0xffffffff)
              row = bytes([0]) + bytes([30, 144, 255, 255]) * size
              raw = row * size
              return b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack("!IIBBBBB", size, size, 8, 6, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(raw)) + chunk(b"IEND", b"")
          for density, px in {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}.items():
              folder = f"lebm_royale_v13/app/src/main/res/mipmap-{density}"
              os.makedirs(folder, exist_ok=True)
              for name in ("ic_launcher.png", "ic_launcher_round.png"):
                  with open(os.path.join(folder, name), "wb") as fh:
                      fh.write(make_png(px))
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
        working-directory: lebm_royale_v13

      - name: Copy APK
        run: cp lebm_royale_v13/app/build/outputs/apk/debug/app-debug.apk L.E.B-M-Royale3D-v1.3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: L.E.B-M-Royale3D-v1.3
          path: L.E.B-M-Royale3D-v1.3.apk
          if-no-files-found: error
